function showError(kind, detail) {
  const e = ERRORS[kind] || ERRORS.unknown;
  E.errTitle.textContent = e.title;
  E.errMsg.textContent = e.msg;
  E.errSteps.innerHTML = e.steps.map(s => `<li>${s}</li>`).join('');
  E.errCode.textContent = detail || '';
  E.retryCam.style.display = (kind === 'insecure' || kind === 'unsupported') ? 'none' : '';
  E.retryCam.innerHTML = kind === 'webgl'
    ? '<svg class="i" style="width:20px;height:20px"><use href="#i-refresh"/></svg>새로 고침'
    : '<svg class="i" style="width:20px;height:20px"><use href="#i-refresh"/></svg>카메라 다시 연결';
  E.retryCam.dataset.kind = kind;
  E.camError.classList.add('open');
  E.camError.setAttribute('aria-hidden', 'false');
  showSplash(false);
}
function hideError() {
  E.camError.classList.remove('open');
  E.camError.setAttribute('aria-hidden', 'true');
}
function classifyError(e) {
  const n = (e && e.name) || '';
  if (n === 'NotAllowedError' || n === 'PermissionDeniedError' || n === 'SecurityError') return 'denied';
  if (n === 'NotFoundError' || n === 'DevicesNotFoundError' || n === 'OverconstrainedError') return 'notfound';
  if (n === 'NotReadableError' || n === 'TrackStartError' || n === 'AbortError') return 'busy';
  if (n === 'InsecureError') return 'insecure';
  if (n === 'UnsupportedError') return 'unsupported';
  return 'unknown';
}

const Cam = {
  stream: null,
  audioStream: null,
  starting: false,
  ready: false,
  async start() {
    if (this.starting) return;
    this.starting = true;
    this.ready = false;
    hideError();
    showSplash(true, '카메라를 연결하는 중…');
    try {
      if (!window.isSecureContext) throw Object.assign(new Error('Page is not served over HTTPS'), { name: 'InsecureError' });
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw Object.assign(new Error('navigator.mediaDevices.getUserMedia is missing'), { name: 'UnsupportedError' });
      }
      this.stop();
      const facing = { facingMode: { ideal: S.facing } };
      const attempts = [
        { video: Object.assign({ width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } }, facing), audio: false },
        { video: Object.assign({ width: { ideal: 1280 }, height: { ideal: 720 } }, facing), audio: false },
        { video: facing, audio: false },
        { video: true, audio: false }
      ];
      let stream = null, lastErr = null;
      for (const c of attempts) {
        try { stream = await navigator.mediaDevices.getUserMedia(c); break; }
        catch (err) {
          lastErr = err;
          if (err.name === 'NotAllowedError' || err.name === 'SecurityError') throw err;
        }
      }
      if (!stream) throw lastErr || new Error('No camera stream');
      this.stream = stream;
      const track = stream.getVideoTracks()[0];
      track.addEventListener('ended', () => {
        if (this.stream === stream) { this.ready = false; if (S.recording) Recorder.stop(); showError('ended'); }
      });
      const st = track.getSettings ? track.getSettings() : {};
      if (st.facingMode === 'user' || st.facingMode === 'environment') S.facing = st.facingMode;
      E.video.srcObject = stream;
      E.video.muted = true;
      E.video.setAttribute('playsinline', '');
      try { await E.video.play(); } catch (e) { /* autoplay may need a tap; frames still arrive */ }
      const t0 = performance.now();
      while (!(E.video.videoWidth > 0 && E.video.readyState >= 2)) {
        if (performance.now() - t0 > 6000) throw Object.assign(new Error('Video frames did not arrive'), { name: 'AbortError' });
        await sleep(40);
      }
      this.ready = true;
      showSplash(false);
    } catch (e) {
      console.warn('[camera]', e);
      showError(classifyError(e), `${e.name || 'Error'}: ${e.message || e}`);
    } finally {
      this.starting = false;
    }
  },
  stop() {
    if (this.stream) this.stream.getTracks().forEach(t => t.stop());
    this.stream = null;
    this.ready = false;
  },
  alive() {
    return !!(this.stream && this.stream.getVideoTracks().some(t => t.readyState === 'live'));
  },
  async getAudio() {
    if (this.audioStream && this.audioStream.getAudioTracks().some(t => t.readyState === 'live')) return this.audioStream;
    try {
      this.audioStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    } catch (e) {
      this.audioStream = null;
    }
    return this.audioStream;
  },
  async switchFacing() {
    if (S.recording || S.busy) return;
    S.facing = S.facing === 'user' ? 'environment' : 'user';
    S.mirror = S.facing === 'user';
    syncUI();
    await this.start();
    toast(S.facing === 'user' ? '전면 카메라' : '후면 카메라');
  }
};

/* =====================================================================
   4. WebGL pipeline
      pass 1  camera → base FBO   (cover-crop, mirror, Center Stage zoom/pan)
      pass 2  base → ¼-res FBOs   (separable gaussian ×2, for portrait blur / glow / thermal)
      pass 3  base+blur → screen  (one draw per viewport: 17 filters + video effects)
   ===================================================================== */
const VS = `
attribute vec2 a_pos;
varying vec2 v_uv;
void main(){ v_uv = a_pos * 0.5 + 0.5; gl_Position = vec4(a_pos, 0.0, 1.0); }`;

const FS_CAM = `
precision highp float;
varying vec2 v_uv;
uniform sampler2D u_cam;
uniform vec2 u_cover;   // visible fraction of the video (object-fit: cover)
uniform vec3 u_cs;      // Center Stage: crop centre (video uv, y-down) + zoom
uniform float u_mirror;
void main(){
  vec2 p = v_uv;
  if (u_mirror > 0.5) p.x = 1.0 - p.x;
  p.y = 1.0 - p.y;
  vec2 t = u_cs.xy + (p - 0.5) * u_cover / u_cs.z;
  gl_FragColor = vec4(texture2D(u_cam, clamp(t, 0.0, 1.0)).rgb, 1.0);
}`;

const FS_BLUR = `
precision mediump float;
varying vec2 v_uv;
uniform sampler2D u_tex;
uniform vec2 u_dir;
uniform vec2 u_scale;
uniform vec2 u_hp;
vec4 S(vec2 uv){ return texture2D(u_tex, clamp(uv, u_hp, 1.0 - u_hp) * u_scale); }
void main(){
  vec4 c = S(v_uv) * 0.2270270270;
  c += (S(v_uv + u_dir * 1.3846153846) + S(v_uv - u_dir * 1.3846153846)) * 0.3162162162;
  c += (S(v_uv + u_dir * 3.2307692308) + S(v_uv - u_dir * 3.2307692308)) * 0.0702702703;
  gl_FragColor = c;
}`;

const FS_MAIN = `
precision highp float;
varying vec2 v_uv;
uniform sampler2D u_base;
uniform sampler2D u_blur;
uniform vec2 u_bs;      // base region scale inside its texture
uniform vec2 u_ls;      // blur region scale inside its texture
uniform vec2 u_bhp;     // half texel clamps
uniform vec2 u_lhp;
uniform vec2 u_texel;   // one base-region texel in uv
uniform vec2 u_crop;    // tile → base cover crop
uniform float u_filter;
uniform vec2 u_center;  // distortion centre (tile uv)
uniform float u_aspect; // tile aspect
uniform float u_baseAspect;
uniform float u_time;
uniform vec2 u_fx;      // x: portrait depth, y: studio light amount
uniform vec3 u_subj;    // subject centre (base uv) + size

vec3 B(vec2 uv){ return texture2D(u_base, clamp(uv, u_bhp, 1.0 - u_bhp) * u_bs).rgb; }
vec3 L(vec2 uv){ return texture2D(u_blur, clamp(uv, u_lhp, 1.0 - u_lhp) * u_ls).rgb; }
float lum(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }
vec3 sat3(vec3 c, float s){ return mix(vec3(lum(c)), c, s); }
float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vignette(vec2 uv, float a, float b){ return 1.0 - smoothstep(a, b, length((uv - 0.5) * 2.0)); }

float sobel(vec2 uv){
  vec2 t = u_texel * 1.4;
  float tl = lum(B(uv + vec2(-t.x,  t.y)));
  float tc = lum(B(uv + vec2( 0.0,  t.y)));
  float tr = lum(B(uv + vec2( t.x,  t.y)));
  float ml = lum(B(uv + vec2(-t.x,  0.0)));
  float mr = lum(B(uv + vec2( t.x,  0.0)));
  float bl = lum(B(uv + vec2(-t.x, -t.y)));
  float bc = lum(B(uv + vec2( 0.0, -t.y)));
  float br = lum(B(uv + vec2( t.x, -t.y)));
  float gx = (tr + 2.0 * mr + br) - (tl + 2.0 * ml + bl);
  float gy = (tl + 2.0 * tc + tr) - (bl + 2.0 * bc + br);
  return length(vec2(gx, gy));
}

/* ---------- Page 2: geometric distortions (UV warps) ---------- */
vec2 distort(vec2 uv, float f, inout float m){
  vec2 asp = vec2(u_aspect, 1.0);
  vec2 c = u_center;
  vec2 q = (uv - c) * asp;
  float r = length(q);
  if (f < 9.5) {                       // 9 Bulge — magnify inside radius
    float k = r / 0.55;
    if (k < 1.0) { float w = 1.0 - k * k; q *= 1.0 - 0.62 * w * w; }
  } else if (f < 10.5) {               // 10 Dent — pinch inside radius
    float k = r / 0.55;
    if (k < 1.0) { float w = 1.0 - k * k; q *= 1.0 + 0.9 * w * w; }
  } else if (f < 11.5) {               // 11 Twirl — angle grows toward the centre
    float R = 0.62;
    if (r < R) {
      float k = 1.0 - r / R;
      float a = k * k * 3.4;
      float s = sin(a), co = cos(a);
      q = vec2(q.x * co - q.y * s, q.x * s + q.y * co);
    }
  } else if (f < 12.5) {               // 12 Squeeze — compress horizontally toward centre
    float t = abs(q.x) / 0.72;
    if (t < 1.0) { float w = 1.0 - t * t; q.x *= 1.0 + 1.2 * w * w; }
  } else if (f < 13.5) {               // 13 Mirror — left half reflected onto the right
    vec2 u = uv;
    if (u.x > c.x) u.x = 2.0 * c.x - u.x;
    return u;
  } else if (f < 14.5) {               // 14 Light Tunnel — radial smear outside the circle
    float R = 0.22;
    if (r > R) {
      q = q / r * (R + (r - R) * 0.045);
      m = 1.0 - 0.18 * smoothstep(R, R + 0.9, r);
    }
  } else if (f < 15.5) {               // 15 Stretch — widen around the vertical axis
    float t = abs(q.x) / 0.95;
    if (t < 1.0) { float w = 1.0 - t * t; q.x *= 1.0 - 0.58 * w * w; }
  } else {                             // 16 Fisheye — spherical barrel + round mask
    float R0 = 0.43 * sqrt(u_aspect * u_aspect + 1.0);
    float nr = r / R0;
    m = (1.0 - smoothstep(0.975, 1.0, nr)) * mix(1.0, 0.72, smoothstep(0.6, 1.0, nr));
    q *= 0.5 + 0.5 * nr * nr;
  }
  return c + q / asp;
}

/* ---------- Video effects (subject-aware) ---------- */
float subjectMask(vec2 buv){
  vec2 d = (buv - u_subj.xy) * vec2(u_baseAspect, 1.0);
  float z = u_subj.z;
  float t = smoothstep(0.0, -z * 1.1, d.y);              // below the face → shoulders
  vec2 rad = z * vec2(mix(0.62, 1.25, t), mix(1.0, 2.3, t));
  float e = length(d / rad);
  return 1.0 - smoothstep(0.7, 1.25, e);
}
vec3 studio(vec3 c, float m, vec2 buv, float k){
  vec2 d = (buv - u_subj.xy) * vec2(u_baseAspect, 1.0);
  float spot = 1.0 - smoothstep(0.15, 1.1, length(d) / max(u_subj.z * 2.4, 0.2));
  vec3 s = c * (1.0 + 0.24 * k) + 0.035 * k;               // key light
  s = mix(s, s * vec3(1.07, 1.0, 0.9), k);                 // warm
  s = mix(s, smoothstep(0.0, 1.0, s), 0.35 * k);           // soft contrast
  vec3 bg = c * mix(1.0, 0.2 + 0.5 * spot, k);             // dim the room
  bg = mix(bg, vec3(lum(bg)), 0.3 * k);
  return mix(bg, s, m);
}

/* ---------- Page 1: colour / stylise ---------- */
vec3 colorFilter(vec3 c, vec3 bl, vec2 buv, vec2 tuv, float f){
  float grain = hash(tuv * 917.0 + fract(u_time * 0.37)) - 0.5;
  if (f < 1.5) {                       // 1 Sepia
    vec3 s = vec3(dot(c, vec3(0.393, 0.769, 0.189)),
                  dot(c, vec3(0.349, 0.686, 0.168)),
                  dot(c, vec3(0.272, 0.534, 0.131)));
    s = (min(s, 1.0) - 0.5) * 1.08 + 0.5;
    s *= mix(0.6, 1.04, vignette(tuv, 0.45, 1.55));
    return clamp(s + grain * 0.045, 0.0, 1.0);
  } else if (f < 2.5) {                // 2 Black & White (noir)
    float l = lum(c);
    l = clamp((l - 0.5) * 1.5 + 0.5, 0.0, 1.0);
    l = smoothstep(0.0, 1.0, l);
    l *= mix(0.5, 1.0, vignette(tuv, 0.4, 1.5));
    return vec3(clamp(l + grain * 0.06, 0.0, 1.0));
  } else if (f < 3.5) {                // 3 Thermal Camera
    float t = clamp(lum(mix(c, bl, 0.4)) * 1.12 - 0.04, 0.0, 1.0);
    vec3 c0 = vec3(0.02, 0.0, 0.22), c1 = vec3(0.05, 0.15, 0.95), c2 = vec3(0.6, 0.05, 0.85);
    vec3 c3 = vec3(1.0, 0.1, 0.18), c4 = vec3(1.0, 0.86, 0.0), c5 = vec3(1.0);
    vec3 g;
    if (t < 0.2) g = mix(c0, c1, t / 0.2);
    else if (t < 0.4) g = mix(c1, c2, (t - 0.2) / 0.2);
    else if (t < 0.6) g = mix(c2, c3, (t - 0.4) / 0.2);
    else if (t < 0.8) g = mix(c3, c4, (t - 0.6) / 0.2);
    else g = mix(c4, c5, (t - 0.8) / 0.2);
    return g;
  } else if (f < 4.5) {                // 4 X-Ray
    float l = 1.0 - lum(c);
    l = pow(clamp(l, 0.0, 1.0), 1.6) * 1.25;
    float e = sobel(buv);
    vec3 col = vec3(0.32, 0.78, 1.0) * l + vec3(0.15, 0.95, 1.0) * smoothstep(0.08, 0.6, e) * 0.85;
    col += vec3(0.0, 0.03, 0.09) + grain * 0.03;
    return clamp(col, 0.0, 1.0);
  } else if (f < 5.5) {                // 5 Comic Book
    float e = sobel(buv);
    vec3 s = sat3(c, 1.65);
    s = (s - 0.5) * 1.15 + 0.5;
    s = floor(clamp(s, 0.0, 1.0) * 4.0 + 0.5) / 4.0;
    float l = lum(s);
    vec2 g = mat2(0.7071, -0.7071, 0.7071, 0.7071) * (tuv * vec2(u_aspect, 1.0) * 150.0);
    float d = length(fract(g) - 0.5);
    float ht = smoothstep(0.0, 0.08, d - (1.0 - l) * 0.5);
    s *= mix(0.72, 1.0, ht);
    s *= 1.0 - smoothstep(0.2, 0.42, e);
    return s;
  } else if (f < 6.5) {                // 6 Glow
    vec3 bloom = max(bl - 0.48, 0.0) * 2.1;
    vec3 col = mix(c, bl, 0.38);
    col = 1.0 - (1.0 - col) * (1.0 - bloom);                // screen blend
    col = sat3(col * 1.04 + 0.02, 1.1);
    return clamp(col, 0.0, 1.0);
  } else if (f < 7.5) {                // 7 Plastic Camera (toy)
    vec3 s = sat3(c, 1.6);
    s = (s - 0.5) * 1.32 + 0.5;
    s.r = smoothstep(-0.05, 1.0, s.r);
    s.b = s.b * 0.82 + 0.09;
    float v = 1.0 - smoothstep(0.45, 1.42, length((tuv - 0.5) * 2.0));
    s *= mix(0.08, 1.1, v);
    s += vec3(1.0, 0.38, 0.1) * 0.2 * smoothstep(0.8, 1.6, tuv.x + tuv.y);
    return clamp(s + grain * 0.035, 0.0, 1.0);
  } else {                             // 8 Color Pencil
    float l = lum(c);
    float e = sobel(buv);
    vec2 p = tuv * vec2(u_aspect, 1.0) * 260.0;
    float n = hash(floor(p * 0.25));
    float h1 = abs(sin((p.x + p.y) * 0.9 + n * 1.5));
    float h2 = abs(sin((p.x - p.y) * 0.9 + n));
    float dark = 1.0 - l;
    float stroke = smoothstep(0.35, 0.95, h1) * smoothstep(0.12, 0.8, dark) * 0.75
                 + smoothstep(0.4, 1.0, h2) * smoothstep(0.5, 1.0, dark) * 0.6;
    vec3 paper = vec3(0.98, 0.96, 0.91);
    vec3 pig = sat3(c, 1.4) * 0.92 + 0.04;
    vec3 col = mix(paper, pig, clamp(0.18 + stroke * 0.85, 0.0, 1.0));
    col = mix(col, vec3(0.17, 0.16, 0.2), smoothstep(0.12, 0.42, e) * 0.85);
    col *= 0.955 + 0.045 * hash(floor(p * 1.7));
    return col;
  }
}

void main(){
  float f = u_filter;
  float m = 1.0;
  vec2 tuv = v_uv;
  if (f > 8.5 && f < 16.5) tuv = distort(tuv, f, m);
  vec2 buv = (tuv - 0.5) * u_crop + 0.5;
  vec3 c = B(buv);
  vec3 bl = L(buv);
  if (u_fx.x > 0.001 || u_fx.y > 0.001) {
    float sm = subjectMask(buv);
    if (u_fx.x > 0.001) c = mix(c, bl, (1.0 - sm) * u_fx.x);
    if (u_fx.y > 0.001) { c = studio(c, sm, buv, u_fx.y); bl = studio(bl, sm, buv, u_fx.y); }
  }
  vec3 col = (f > 0.5 && f < 8.5) ? colorFilter(c, bl, buv, tuv, f) : c;
  gl_FragColor = vec4(col * m, 1.0);
}`;

const GLR = {
  gl: null, ok: false, lost: false, hasFrame: false,
  W: 0, H: 0, cssW: 0, cssH: 0, ratio: 1,
  progCam: null, progBlur: null, progMain: null,
  quad: null, texVideo: null, fbBase: null, fbB1: null, fbB2: null,

  init() {
    const opts = { alpha: false, antialias: false, depth: false, stencil: false, preserveDrawingBuffer: true, premultipliedAlpha: false, powerPreference: 'high-performance' };
    const gl = E.gl.getContext('webgl', opts) || E.gl.getContext('experimental-webgl', opts);
    if (!gl) return false;
    this.gl = gl;
    try { this.build(); } catch (e) { console.error(e); showError('webgl', String(e.message || e)); return false; }
    E.gl.addEventListener('webglcontextlost', ev => { ev.preventDefault(); this.lost = true; this.ok = false; }, false);
    E.gl.addEventListener('webglcontextrestored', () => {
      this.lost = false;
      try { this.fbBase = this.fbB1 = this.fbB2 = null; this.W = this.H = 0; this.build(); this.resize(); } catch (e) { showError('webgl', String(e)); }
    }, false);
    return true;
  },
  build() {
    const gl = this.gl;
    const compile = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error('Shader: ' + gl.getShaderInfoLog(s));
      return s;
    };
    const program = fs => {
      const p = gl.createProgram();
      gl.attachShader(p, compile(gl.VERTEX_SHADER, VS));
      gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
      gl.bindAttribLocation(p, 0, 'a_pos');
      gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('Link: ' + gl.getProgramInfoLog(p));
      const u = {};
      const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
      for (let i = 0; i < n; i++) {
        const info = gl.getActiveUniform(p, i);
        u[info.name] = gl.getUniformLocation(p, info.name);
      }
      return { p, u };
    };
    this.progCam = program(FS_CAM);
    this.progBlur = program(FS_BLUR);
    this.progMain = program(FS_MAIN);
    this.quad = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.quad);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    this.texVideo = this.makeTex(2, 2);
    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.BLEND);
    this.ok = true;
  },
  makeTex(w, h) {
    const gl = this.gl, t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    return t;
  },
  makeFB(w, h) {
    const gl = this.gl, tex = this.makeTex(w, h), fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { fb, tex, w, h };
  },
  freeFB(f) { if (f) { this.gl.deleteFramebuffer(f.fb); this.gl.deleteTexture(f.tex); } },
  resize() {
    if (!this.ok) return false;
    const r = E.app.getBoundingClientRect();
    const cssW = Math.max(1, r.width), cssH = Math.max(1, r.height);
    const ratio = Math.min(window.devicePixelRatio || 1, 2, 2048 / Math.max(cssW, cssH));
    const W = Math.round(cssW * ratio), H = Math.round(cssH * ratio);
    this.cssW = cssW; this.cssH = cssH; this.ratio = ratio;
    if (W === this.W && H === this.H) return false;
    this.W = W; this.H = H;
    E.gl.width = W; E.gl.height = H;
    this.freeFB(this.fbBase); this.freeFB(this.fbB1); this.freeFB(this.fbB2);
    this.fbBase = this.makeFB(W, H);
    const bw = Math.max(1, Math.ceil(W / 4)), bh = Math.max(1, Math.ceil(H / 4));
    this.fbB1 = this.makeFB(bw, bh);
    this.fbB2 = this.makeFB(bw, bh);
    return true;
  },
  upload(video) {
    if (!this.ok || !(video.readyState >= 2) || !video.videoWidth) return;
    const gl = this.gl;
    gl.bindTexture(gl.TEXTURE_2D, this.texVideo);
    try {
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
      this.hasFrame = true;
    } catch (e) { /* frame not ready */ }
  },
  blurPass(inTex, inScale, inW, inH, out, ow, oh, dx, dy) {
    const gl = this.gl, P = this.progBlur;
    gl.bindFramebuffer(gl.FRAMEBUFFER, out.fb);
    gl.viewport(0, 0, ow, oh);
    gl.useProgram(P.p);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, inTex);
    gl.uniform1i(P.u.u_tex, 0);
    gl.uniform2f(P.u.u_dir, dx, dy);
    gl.uniform2f(P.u.u_scale, inScale[0], inScale[1]);
    gl.uniform2f(P.u.u_hp, 0.5 / inW, 0.5 / inH);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  },
  /* P = { scale, cover:[x,y], cs:[x,y,z], mirror, needBlur, fx:[p,s], subj:[x,y,z], time, tiles:[{x,y,w,h,filter,center}], scissor } */
  render(P) {
    if (!this.ok || this.lost || !this.fbBase) return;
    const gl = this.gl, W = this.W, H = this.H;
    const bw = Math.max(1, Math.round(W * P.scale)), bh = Math.max(1, Math.round(H * P.scale));
    const bs = [bw / W, bh / H];

    // pass 1 — camera
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fbBase.fb);
    gl.viewport(0, 0, bw, bh);
    const C = this.progCam;
    gl.useProgram(C.p);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.texVideo);
    gl.uniform1i(C.u.u_cam, 0);
    gl.uniform2f(C.u.u_cover, P.cover[0], P.cover[1]);
    gl.uniform3f(C.u.u_cs, P.cs[0], P.cs[1], P.cs[2]);
    gl.uniform1f(C.u.u_mirror, P.mirror ? 1 : 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // pass 2 — blur pyramid (quarter resolution)
    const B1 = this.fbB1, B2 = this.fbB2;
    const lw = Math.max(1, Math.round(B1.w * P.scale)), lh = Math.max(1, Math.round(B1.h * P.scale));
    const ls = [lw / B1.w, lh / B1.h];
    if (P.needBlur) {
      this.blurPass(this.fbBase.tex, bs, bw, bh, B1, lw, lh, 1.0 / lw, 0);
      this.blurPass(B1.tex, ls, lw, lh, B2, lw, lh, 0, 1.0 / lh);
      this.blurPass(B2.tex, ls, lw, lh, B1, lw, lh, 2.2 / lw, 0);
      this.blurPass(B1.tex, ls, lw, lh, B2, lw, lh, 0, 2.2 / lh);
    }

    // pass 3 — filters to screen
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, W, H);
    gl.disable(gl.SCISSOR_TEST);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    if (P.scissor) { gl.enable(gl.SCISSOR_TEST); gl.scissor(P.scissor[0], P.scissor[1], P.scissor[2], P.scissor[3]); }
    const M = this.progMain;
    gl.useProgram(M.p);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.fbBase.tex);
    gl.uniform1i(M.u.u_base, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, B2.tex);
    gl.uniform1i(M.u.u_blur, 1);
    gl.uniform2f(M.u.u_bs, bs[0], bs[1]);
    gl.uniform2f(M.u.u_ls, ls[0], ls[1]);
    gl.uniform2f(M.u.u_bhp, 0.5 / bw, 0.5 / bh);
    gl.uniform2f(M.u.u_lhp, 0.5 / lw, 0.5 / lh);
    gl.uniform2f(M.u.u_texel, 1 / bw, 1 / bh);
    const baseAspect = W / H;
    gl.uniform1f(M.u.u_baseAspect, baseAspect);
    gl.uniform1f(M.u.u_time, P.time % 1000);
    gl.uniform2f(M.u.u_fx, P.fx[0], P.fx[1]);
    gl.uniform3f(M.u.u_subj, P.subj[0], P.subj[1], P.subj[2]);
    for (const t of P.tiles) {
      if (t.w < 1 || t.h < 1) continue;
      gl.viewport(Math.round(t.x), Math.round(t.y), Math.round(t.w), Math.round(t.h));
      const ta = t.w / t.h;
      const crop = ta > baseAspect ? [1, baseAspect / ta] : [ta / baseAspect, 1];
      gl.uniform2f(M.u.u_crop, crop[0], crop[1]);
      gl.uniform1f(M.u.u_aspect, ta);
      gl.uniform1f(M.u.u_filter, t.filter);
      gl.uniform2f(M.u.u_center, t.center[0], t.center[1]);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    gl.disable(gl.SCISSOR_TEST);
  }
};

/* =====================================================================
   5. Subject tracking — drives Center Stage auto-framing and the
      portrait / studio-light subject mask (skin-tone + motion centroid)
   ===================================================================== */
const Track = {
  cvs: document.createElement('canvas'), ctx: null, prev: null,
  last: 0, lostAt: 0, found: false,
  raw: { x: 0.5, y: 0.42, s: 0.13 },
  subj: { x: 0.5, y: 0.42, s: 0.13 },
  target: { x: 0.5, y: 0.5, z: 1 },
  cs: { x: 0.5, y: 0.5, z: 1 },
  face: { x: 0.5, y: 0.42, w: 0.2, h: 0.26, eyes: null, alpha: 0, init: false },
  faceRaw: null,
  needed() { return S.center || S.portrait || S.studio || Stickers.inUse(); },
  // MediaPipe face detector results (video pixel space → video uv)
  applyFace(dets, vw, vh, now) {
    let best = null, area = 0;
    for (const d of dets || []) {
      const b = d.boundingBox;
      if (b && b.width * b.height > area) { area = b.width * b.height; best = d; }
    }
    if (!best) {
      if (!this.lostAt) this.lostAt = now;
      if (now - this.lostAt > 700) this.found = false;
      return;
    }
    const b = best.boundingBox, kp = best.keypoints || [];
    const cx = (b.originX + b.width / 2) / vw, cy = (b.originY + b.height / 2) / vh;
    const w = b.width / vw, h = b.height / vh;
    this.found = true;
    this.lostAt = 0;
    this.raw = { x: cx, y: cy, s: clamp(h / 3.4, 0.03, 0.3) };
    this.faceRaw = { x: cx, y: cy, w, h, eyes: kp.length >= 2 ? [kp[0].x, kp[0].y, kp[1].x, kp[1].y] : null };
  },
  // video uv (y-down, unmirrored) → displayed base uv (y-up)
  toBase(vx, vy, cover) {
    const cs = this.cs;
    let x = (vx - cs.x) * cs.z / cover[0] + 0.5;
    const y = (vy - cs.y) * cs.z / cover[1] + 0.5;
    if (S.mirror) x = 1 - x;
    return [x, 1 - y];
  },
  analyze(now) {
    const v = E.video;
    if (!v.videoWidth || now - this.last < 110) return;
    this.last = now;
    const aw = 64, ah = Math.max(16, Math.round(64 * v.videoHeight / v.videoWidth));
    if (this.cvs.width !== aw || this.cvs.height !== ah || !this.ctx) {
      this.cvs.width = aw; this.cvs.height = ah;
      this.ctx = this.cvs.getContext('2d', { willReadFrequently: true });
      this.prev = new Float32Array(aw * ah);
    }
    let d;
    try { this.ctx.drawImage(v, 0, 0, aw, ah); d = this.ctx.getImageData(0, 0, aw, ah).data; }
    catch (e) { return; }
    const px = this.found ? this.raw.x : 0.5, py = this.found ? this.raw.y : 0.45;
    const sig2 = 2 * Math.pow(this.found ? 0.3 : 0.6, 2);
    let sw = 0, sx = 0, sy = 0, sxx = 0, syy = 0;
    for (let y = 0; y < ah; y++) {
      const ny = (y + 0.5) / ah;
      for (let x = 0; x < aw; x++) {
        const i = y * aw + x, o = i * 4;
        const r = d[o], g = d[o + 1], b = d[o + 2];
        const Y = 0.299 * r + 0.587 * g + 0.114 * b;
        const cb = 128 - 0.168736 * r - 0.331264 * g + 0.5 * b;
        const cr = 128 + 0.5 * r - 0.418688 * g - 0.081312 * b;
        const skin = (cr > 136 && cr < 178 && cb > 78 && cb < 130 && Y > 40 && Y < 248) ? 1 : 0;
        const mot = Math.abs(Y - this.prev[i]) > 16 ? 1 : 0;
        this.prev[i] = Y;
        let w = skin * (1 + mot) + mot * 0.12;
        if (!w) continue;
        const nx = (x + 0.5) / aw, dx = nx - px, dy = ny - py;
        w *= Math.exp(-(dx * dx + dy * dy) / sig2);
        sw += w; sx += w * nx; sy += w * ny; sxx += w * nx * nx; syy += w * ny * ny;
      }
    }
    if (sw > aw * ah * 0.012) {
      const mx = sx / sw, my = sy / sw;
      const vy = Math.sqrt(Math.max(0, syy / sw - my * my));
      this.found = true;
      this.lostAt = 0;
      this.raw = { x: mx, y: clamp(my - vy * 0.35, 0.05, 0.95), s: clamp(vy, 0.05, 0.3) };
      const fh = this.raw.s * 3.4;
      this.faceRaw = { x: mx, y: this.raw.y, w: fh * 0.8 * (v.videoHeight / v.videoWidth), h: fh, eyes: null };
    } else {
      if (!this.lostAt) this.lostAt = now;
      if (now - this.lostAt > 1500) this.found = false;
    }
  },
  step(dt, cover) {
    const R = this.found ? this.raw : { x: 0.5, y: 0.42, s: 0.13 };
    const ks = 1 - Math.exp(-dt * 6);
    const fr = this.faceRaw, F = this.face;
    if (fr) {
      const kf = F.init ? 1 - Math.exp(-dt * 14) : 1;
      F.x += (fr.x - F.x) * kf; F.y += (fr.y - F.y) * kf;
      F.w += (fr.w - F.w) * kf; F.h += (fr.h - F.h) * kf;
      if (fr.eyes && F.eyes && F.init) for (let i = 0; i < 4; i++) F.eyes[i] += (fr.eyes[i] - F.eyes[i]) * kf;
      else F.eyes = fr.eyes ? fr.eyes.slice() : null;
      F.init = true;
    }
    F.alpha += ((this.found && fr ? 1 : 0) - F.alpha) * (1 - Math.exp(-dt * 7));
    this.subj.x += (R.x - this.subj.x) * ks;
    this.subj.y += (R.y - this.subj.y) * ks;
    this.subj.s += (R.s - this.subj.s) * ks;

    let tx = 0.5, ty = 0.5, tz = 1;
    if (S.center && this.found) {
      const want = [0.24, 0.33, 0.45][S.framing] || 0.33;
      tz = clamp(cover[1] * want / Math.max(R.s * 3.4, 0.02), 1, 2.6);
      tx = R.x;
      ty = R.y + (cover[1] / tz) * 0.12;     // headroom: keep the face above centre
    }
    const T = this.target;
    if (!S.center || Math.abs(tx - T.x) > 0.035 || Math.abs(ty - T.y) > 0.035) { T.x = tx; T.y = ty; }
    if (!S.center || Math.abs(tz - T.z) > 0.09) T.z = tz;
    const speed = S.smooth ? 1.5 : 4.5;
    const k = 1 - Math.exp(-dt * speed), kz = 1 - Math.exp(-dt * speed * 0.7);
    const cs = this.cs;
    cs.z += (T.z - cs.z) * kz;
    cs.x += (T.x - cs.x) * k;
    cs.y += (T.y - cs.y) * k;
    const hx = 0.5 * cover[0] / cs.z, hy = 0.5 * cover[1] / cs.z;
    cs.x = clamp(cs.x, hx, 1 - hx);
    cs.y = clamp(cs.y, hy, 1 - hy);
  },
  subjectDisplay(cover) {
    const cs = this.cs, s = this.subj;
    let x = (s.x - cs.x) * cs.z / cover[0] + 0.5;
    let y = (s.y - cs.y) * cs.z / cover[1] + 0.5;
    if (S.mirror) x = 1 - x;
    y = 1 - y;
    return [x, y, clamp(s.s * 2.6 * cs.z / cover[1], 0.12, 0.7)];
  }
};

function coverOf() {
  const v = E.video;
  const va = (v.videoWidth || 16) / (v.videoHeight || 9);
  const ca = (GLR.W || 16) / (GLR.H || 9);
  return ca > va ? [1, va / ca] : [ca / va, 1];
}

/* =====================================================================
   6. 3×3 live effects grid (single canvas, 9 viewports, one stream)
   ===================================================================== */
const TILE_CENTER = [0.5, 0.52];
const Grid = {
  area: { x: 0, y: 0, w: 1, h: 1 },
  gap: 3,
  anim: null,
  computeArea() {
    const app = E.app.getBoundingClientRect();
    const top = E.topBar.getBoundingClientRect().bottom + 12;
    const bottom = E.controls.getBoundingClientRect().top - 60;
    const left = 14, right = app.width - 14;
    let w = Math.max(60, right - left), h = Math.max(60, bottom - top);
    // keep tiles close to the camera aspect (light crop allowed) so faces are not cut off
    const base = app.width / Math.max(1, app.height), g2 = this.gap * 2;
    const tileA = ((w - g2) / 3) / ((h - g2) / 3);
    const want = clamp(tileA, base * 0.85, base * 1.2);
    if (tileA > want) w = (h - g2) * want + g2;
    else if (tileA < want) h = (w - g2) / want + g2;
    const x = left + (right - left - w) / 2, y = top + (Math.max(60, bottom - top) - h) / 2;
    this.area = { x, y, w, h };
    const el = E.gridLabels;
    el.style.left = this.area.x + 'px';
    el.style.top = this.area.y + 'px';
    el.style.width = this.area.w + 'px';
    el.style.height = this.area.h + 'px';
    el.style.gap = this.gap + 'px';
  },
  tileCSS(i) {
    const a = this.area, g = this.gap;
    const tw = (a.w - 2 * g) / 3, th = (a.h - 2 * g) / 3;
    return { x: a.x + (i % 3) * (tw + g), y: a.y + ((i / 3) | 0) * (th + g), w: tw, h: th };
  },
  toGL(r) {
    const kx = GLR.W / GLR.cssW, ky = GLR.H / GLR.cssH;
    return { x: r.x * kx, y: GLR.H - (r.y + r.h) * ky, w: r.w * kx, h: r.h * ky };
  },
  tileGL(i) { return this.toGL(this.tileCSS(i)); },
  full() { return { x: 0, y: 0, w: GLR.W, h: GLR.H }; },
  hit(cx, cy) {
    const a = this.area;
    if (cx < a.x || cy < a.y || cx > a.x + a.w || cy > a.y + a.h) return -1;
    const col = clamp(Math.floor((cx - a.x) / (a.w / 3)), 0, 2);
    const row = clamp(Math.floor((cy - a.y) / (a.h / 3)), 0, 2);
    return row * 3 + col;
  },
  buildLabels() {
    const el = E.gridLabels;
    if (!el.children.length) {
      for (let i = 0; i < 9; i++) {
        const d = document.createElement('div');
        d.className = 'gl-tile';
        d.appendChild(document.createElement('span'));
        el.appendChild(d);
      }
    }
    PAGES[S.page].forEach((f, i) => {
      const t = el.children[i];
      t.firstChild.innerHTML = `${FILTERS[f].ko}<small>${FILTERS[f].name}</small>`;
      t.classList.toggle('sel', f === S.filter);
    });
  },
  open() {
    if (S.grid || this.anim || S.busy || S.recording) return;
    closePanel();
    if (isSticker(S.filter)) S.page = 2;
    else if (isDistortion(S.filter)) S.page = 1;
    else if (S.filter !== 0) S.page = 0;
    S.grid = true;
    this.computeArea();
    this.buildLabels();
    const idx = PAGES[S.page].indexOf(S.filter);
    this.anim = { type: 'out', t0: performance.now(), dur: 560, filter: S.filter, idx: idx < 0 ? 4 : idx };
    syncUI();
  },
  select(idx) {
    if (!S.grid || this.anim) return;
    const f = PAGES[S.page][idx];
    S.filter = f;
    S.distCenter = TILE_CENTER.slice();
    savePrefs();
    E.gridLabels.classList.remove('show');
    this.buildLabels();
    this.anim = { type: 'in', t0: performance.now(), dur: 600, filter: f, idx };
    Sound.pop(1.2);
    syncUI();
  },
  close() {
    if (!S.grid || this.anim) return;
    const idx = PAGES[S.page].indexOf(S.filter);
    E.gridLabels.classList.remove('show');
    this.anim = { type: 'in', t0: performance.now(), dur: 600, filter: S.filter, idx: idx < 0 ? 4 : idx };
    syncUI();
  },
  setPage(p) {
    if (!S.grid || this.anim || p === S.page || p < 0 || p >= PAGES.length) return;
    this.anim = { type: 'page', t0: performance.now(), dur: 520, from: S.page, to: p, dir: p > S.page ? 1 : -1 };
    S.page = p;
    E.gridLabels.classList.add('swap');
    E.gridLabels.classList.remove('show');
    syncUI();
  },
  finish() {
    const A = this.anim;
    this.anim = null;
    if (!A) return;
    if (A.type === 'in') {
      S.grid = false;
      syncUI();
    } else {
      this.buildLabels();
      E.gridLabels.classList.remove('swap');
      E.gridLabels.classList.add('show');
    }
    if (Grid.onIdle) { const cb = Grid.onIdle; Grid.onIdle = null; cb(); }
  },
  whenIdle() {
    return new Promise(res => { if (!this.anim) res(); else this.onIdle = res; });
  }
};

function lerpRect(a, b, t) {
  return { x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t), w: lerp(a.w, b.w, t), h: lerp(a.h, b.h, t) };
}

/* Last rendered layout — the sticker layer maps the face into these tiles */
const Scene = { tiles: [], cover: [1, 1], scissor: null };

/* Assemble the frame description for the renderer */
function drawScene(now, dt) {
  const cover = coverOf();
  Track.step(dt, cover);
  const subj = Track.subjectDisplay(cover);
  const tiles = [];
  let scale = 1, scissor = null;
  const A = Grid.anim;
  const p = A ? clamp((now - A.t0) / A.dur, 0, 1) : 0;

  if (!S.grid) {
    tiles.push(Object.assign(Grid.full(), { filter: S.filter, center: S.distCenter }));
  } else {
    if (A && A.type === 'page') {
      const e = easeOutCubic(p);
      const shift = (Grid.area.w + Grid.gap) * (GLR.W / GLR.cssW);
      const ag = Grid.toGL(Grid.area);
      scissor = [Math.round(ag.x), Math.round(ag.y), Math.round(ag.w), Math.round(ag.h)];
      PAGES[A.from].forEach((f, i) => {
        const r = Grid.tileGL(i); r.x -= A.dir * e * shift;
        tiles.push(Object.assign(r, { filter: f, center: TILE_CENTER }));
      });
      PAGES[A.to].forEach((f, i) => {
        const r = Grid.tileGL(i); r.x += A.dir * (1 - e) * shift;
        tiles.push(Object.assign(r, { filter: f, center: TILE_CENTER }));
      });
    } else {
      PAGES[S.page].forEach((f, i) => tiles.push(Object.assign(Grid.tileGL(i), { filter: f, center: TILE_CENTER })));
      if (A && (A.type === 'in' || A.type === 'out')) {
        const e = springEase(p);
        const tile = Grid.tileGL(A.idx), full = Grid.full();
        const r = A.type === 'in' ? lerpRect(tile, full, e) : lerpRect(full, tile, e);
        const c = A.type === 'in' ? [lerp(TILE_CENTER[0], S.distCenter[0], e), lerp(TILE_CENTER[1], S.distCenter[1], e)] : TILE_CENTER;
        tiles.push(Object.assign(r, { filter: A.filter, center: c }));
      } else {
        scale = 1 / 3;
      }
    }
  }
  const needBlur = S.portrait || tiles.some(t => BLUR_FILTERS.has(t.filter));
  const ba = GLR.W / GLR.H;
  Scene.cover = cover;
  Scene.scissor = scissor;
  Scene.tiles = tiles.map(t => {
    const ta = t.w / t.h;
    return { x: t.x, y: t.y, w: t.w, h: t.h, filter: t.filter, crop: ta > ba ? [1, ba / ta] : [ta / ba, 1] };
  });
  GLR.render({
    scale, scissor, tiles, needBlur, subj,
    cover, cs: [Track.cs.x, Track.cs.y, Track.cs.z],
    mirror: S.mirror,
    fx: [S.portrait ? 0.35 + 0.65 * S.portraitDepth : 0, S.studio ? S.studioAmt : 0],
    time: now / 1000
  });
  if (A && p >= 1) Grid.finish();
}

/* =====================================================================
   7. Reactions — 2D particle overlay (gravity, velocity, drag, spin, fade)
      drawn onto #fx and composited into photos / movies
   ===================================================================== */
const smooth01 = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const PALETTE = ['#ff3b30', '#ff9500', '#ffcc00', '#34c759', '#0a84ff', '#af52de', '#ff2d55', '#5ac8fa', '#ffffff'];

const FX = {
  ctx: E.fx.getContext('2d'),
  W: 1, H: 1, u: 1,
  effects: [],
  sprites: new Map(),
  dirty: false,
  resize(W, H) {
    E.fx.width = W; E.fx.height = H;
    this.W = W; this.H = H; this.u = Math.min(W, H) / 1000;
    this.dirty = true;
  },
  sprite(ch, b) {
    const key = ch + '|' + b;
    let c = this.sprites.get(key);
    if (!c) {
      c = document.createElement('canvas');
      const s = Math.ceil(b * 1.3);
      c.width = c.height = s;
      const x = c.getContext('2d');
      x.textAlign = 'center';
      x.textBaseline = 'middle';
      x.font = `${b}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
      x.fillText(ch, s / 2, s / 2 + b * 0.06);
      this.sprites.set(key, c);
    }
    return c;
  },
  drawSprite(ch, x, y, size, rot = 0, alpha = 1) {
    if (alpha <= 0.004 || size < 1) return;
    const b = size <= 72 ? 72 : size <= 144 ? 144 : size <= 288 ? 288 : 512;
    const img = this.sprite(ch, b);
    const s = size / b * img.width;
    const ctx = this.ctx;
    ctx.globalAlpha = Math.min(1, alpha);
    if (rot) {
      const c = Math.cos(rot), n = Math.sin(rot);
      ctx.setTransform(c, n, -n, c, x, y);
      ctx.drawImage(img, -s / 2, -s / 2, s, s);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    } else {
      ctx.drawImage(img, x - s / 2, y - s / 2, s, s);
    }
    ctx.globalAlpha = 1;
  },
  spawn(type) {
    if (typeof this.make[type] !== 'function') return;
    this.effects.push(this.make[type].call(this));
    if (this.effects.length > 6) this.effects.shift();
  },
  frame(dt, now) {
    const ctx = this.ctx;
    const stickers = Stickers.active();
    if (!this.effects.length && !stickers) {
      if (this.dirty) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, this.W, this.H); this.dirty = false; }
      return;
    }
    dt = Math.min(dt, 0.05);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, this.W, this.H);
    if (stickers) {
      ctx.save();
      Stickers.draw(ctx, now / 1000);
      ctx.restore();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
    this.effects = this.effects.filter(e => e.update(dt));
    for (const e of this.effects) {
      ctx.save();
      e.draw(ctx);
      ctx.restore();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
    this.dirty = true;
  },
  active() { return this.effects.length > 0 || Stickers.active(); },
  make: {}
};

/* 👍 Thumbs up — big spring pop + burst of small thumbs */
FX.make.thumbs = function () {
  const W = this.W, H = this.H, u = this.u, F = this;
  let t = 0;
  const big = Math.min(W, H) * 0.36;
  const cx = W / 2, cy = H * 0.52;
  const parts = [];
  for (let i = 0; i < 18; i++) {
    const a = -Math.PI / 2 + rand(-1.3, 1.3), sp = rand(420, 980) * u;
    parts.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, rot: rand(-0.6, 0.6), vr: rand(-3, 3),
      size: rand(55, 120) * u, age: 0, life: rand(1.3, 2.1), delay: 0.12 + rand(0, 0.18), ch: pick(['👍', '👍', '👍', '✨']) });
  }
  return {
    update(dt) {
      t += dt;
      for (const p of parts) {
        if (t < p.delay) continue;
        p.age += dt;
        p.vy += 1500 * u * dt;
        p.vx *= Math.exp(-0.8 * dt);
        p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      }
      return t < 2.7;
    },
    draw(ctx) {
      for (const p of parts) if (p.age > 0) F.drawSprite(p.ch, p.x, p.y, p.size * springEase(Math.min(1, p.age * 3)), p.rot, 1 - p.age / p.life);
      const sc = springEase(t * 1.5);
      const rise = t > 1.3 ? Math.pow(t - 1.3, 2) * H * 0.38 : 0;
      const alpha = t > 1.6 ? 1 - (t - 1.6) / 1.05 : 1;
      const g = ctx.createRadialGradient(cx, cy - rise, 0, cx, cy - rise, big * 0.9 * sc + 1);
      g.addColorStop(0, `rgba(120,190,255,${0.45 * alpha})`);
      g.addColorStop(1, 'rgba(120,190,255,0)');
      ctx.fillStyle = g;
      ctx.fillRect(cx - big, cy - rise - big, big * 2, big * 2);
      F.drawSprite('👍', cx, cy - rise, big * sc, Math.sin(t * 7) * 0.14 * Math.exp(-t * 1.6), alpha);
    }
  };
};

/* 🎉 Fireworks — rockets with gravity explode into spark showers */
FX.make.fireworks = function () {
  const W = this.W, H = this.H, u = this.u;
  let t = 0;
  const hues = [0, 28, 50, 120, 190, 220, 285, 320];
  const plan = [0, 0.35, 0.7, 1.05, 1.4, 1.8, 2.15].map(d => ({ d, done: false }));
  const rockets = [], sparks = [], flashes = [];
  const launch = () => rockets.push({ x: rand(0.15, 0.85) * W, y: H + 10 * u, vx: rand(-70, 70) * u, vy: -rand(1.0, 1.32) * H,
    hue: pick(hues), age: 0, fuse: rand(0.7, 0.95) });
  const explode = r => {
    const n = 84, sp0 = rand(0.26, 0.4) * H, ring = Math.random() < 0.35;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + rand(-0.06, 0.06);
      const sp = sp0 * (ring ? rand(0.92, 1) : rand(0.35, 1));
      sparks.push({ x: r.x, y: r.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, hue: (r.hue + rand(-18, 18) + 360) % 360,
        age: 0, life: rand(1.1, 1.9), size: rand(2.2, 3.8) * u, tw: Math.random() < 0.35 });
    }
    flashes.push({ x: r.x, y: r.y, age: 0, hue: r.hue });
  };
  return {
    update(dt) {
      t += dt;
      for (const p of plan) if (!p.done && t >= p.d) { p.done = true; launch(); }
      for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        r.age += dt; r.vy += 0.5 * H * dt; r.x += r.vx * dt; r.y += r.vy * dt;
        if (r.age > r.fuse || r.vy > -0.12 * H) { explode(r); rockets.splice(i, 1); }
      }
      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.age += dt;
        const k = Math.exp(-1.7 * dt);
        s.vx *= k; s.vy = s.vy * k + 0.3 * H * dt;
        s.x += s.vx * dt; s.y += s.vy * dt;
        if (s.age > s.life) sparks.splice(i, 1);
      }
      for (let i = flashes.length - 1; i >= 0; i--) { flashes[i].age += dt; if (flashes[i].age > 0.5) flashes.splice(i, 1); }
      return t < 2.3 || rockets.length > 0 || sparks.length > 0;
    },
    draw(ctx) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round';
      for (const f of flashes) {
        const a = 1 - f.age / 0.5, R = (0.12 + f.age * 0.5) * H;
        const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, R);
        g.addColorStop(0, `hsla(${f.hue},100%,75%,${0.35 * a})`);
        g.addColorStop(1, `hsla(${f.hue},100%,60%,0)`);
        ctx.fillStyle = g;
        ctx.fillRect(f.x - R, f.y - R, R * 2, R * 2);
      }
      for (const r of rockets) {
        ctx.strokeStyle = `hsla(${r.hue},100%,80%,0.9)`;
        ctx.lineWidth = 3 * u;
        ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(r.x - r.vx * 0.06, r.y - r.vy * 0.06); ctx.stroke();
      }
      for (const s of sparks) {
        let a = Math.pow(1 - s.age / s.life, 1.3);
        if (s.tw) a *= 0.45 + 0.55 * Math.abs(Math.sin(s.age * 38));
        ctx.strokeStyle = `hsla(${s.hue},100%,${62 + 30 * (1 - s.age / s.life)}%,${a})`;
        ctx.lineWidth = s.size;
        ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * 0.045, s.y - s.vy * 0.045); ctx.stroke();
      }
    }
  };
};

/* ❤️ Hearts — floating hearts with sway, pop-in and fade */
FX.make.hearts = function () {
  const W = this.W, H = this.H, u = this.u, F = this;
  let t = 0;
  const parts = [];
  for (let i = 0; i < 38; i++) {
    parts.push({ x: rand(0.05, 0.95) * W, y: H + rand(20, 90) * u, vy: -rand(0.22, 0.42) * H, sway: rand(20, 60) * u,
      freq: rand(1.5, 3), ph: rand(0, 6.28), size: rand(55, 130) * u, rot: rand(-0.3, 0.3), delay: rand(0, 1.4),
      age: 0, life: rand(2.6, 3.6), ch: pick(['❤️', '❤️', '❤️', '💖', '💗', '💕']) });
  }
  return {
    update(dt) {
      t += dt;
      let alive = t < 1.6;
      for (const p of parts) {
        if (t < p.delay) { alive = true; continue; }
        p.age += dt; p.y += p.vy * dt; p.vy *= Math.exp(-0.15 * dt);
        if (p.age < p.life) alive = true;
      }
      return alive;
    },
    draw() {
      if (t < 1.4) {
        const a = t < 0.9 ? 1 : 1 - (t - 0.9) / 0.5;
        const beat = 1 + 0.08 * Math.sin(t * 14) * Math.exp(-t * 2);
        F.drawSprite('❤️', W / 2, H * 0.5 - t * 0.08 * H, Math.min(W, H) * 0.3 * springEase(t * 1.8) * beat, 0, a);
      }
      for (const p of parts) {
        if (p.age <= 0 || p.age >= p.life) continue;
        const x = p.x + Math.sin(p.age * p.freq + p.ph) * p.sway;
        const a = p.age > p.life * 0.65 ? 1 - (p.age - p.life * 0.65) / (p.life * 0.35) : 1;
        F.drawSprite(p.ch, x, p.y, p.size * springEase(Math.min(1, p.age * 2.2)), p.rot + Math.sin(p.age * p.freq) * 0.15, a);
      }
    }
  };
};

/* 🎈 Balloons — buoyant, swaying, procedurally shaded with strings */
FX.make.balloons = function () {
  const W = this.W, H = this.H, u = this.u;
  const colors = ['#ff3b30', '#ff9500', '#ffcc00', '#34c759', '#0a84ff', '#af52de', '#ff2d55', '#5ac8fa'];
  const parts = [];
  for (let i = 0; i < 16; i++) {
    parts.push({ x: rand(0.06, 0.94) * W, y: H + rand(0.12, 0.7) * H, vy: -rand(0.17, 0.3) * H, r: rand(48, 82) * u,
      color: pick(colors), sway: rand(10, 32) * u, freq: rand(0.8, 1.6), ph: rand(0, 6.28), age: 0 });
  }
  return {
    update(dt) {
      let alive = false;
      for (const p of parts) {
        p.age += dt;
        p.vy -= 0.04 * H * dt;            // buoyancy accelerates the climb
        p.y += p.vy * dt;
        if (p.y > -p.r * 4) alive = true;
      }
      return alive;
    },
    draw(ctx) {
      for (const p of parts) {
        const sw = Math.sin(p.age * p.freq + p.ph);
        const bx = p.x + sw * p.sway, by = p.y, r = p.r;
        ctx.strokeStyle = 'rgba(255,255,255,0.65)';
        ctx.lineWidth = 1.6 * u;
        ctx.beginPath();
        ctx.moveTo(bx, by + r * 1.08);
        ctx.quadraticCurveTo(bx + Math.sin(p.age * p.freq * 1.3 + p.ph) * r * 0.5, by + r * 2.2, bx - sw * r * 0.3, by + r * 3.4);
        ctx.stroke();
        ctx.save();
        ctx.translate(bx, by);
        ctx.rotate(sw * 0.08);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.moveTo(-r * 0.12, r * 1.12); ctx.lineTo(r * 0.12, r * 1.12); ctx.lineTo(0, r * 0.96); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.ellipse(0, 0, r * 0.86, r, 0, 0, Math.PI * 2); ctx.fill();
        const g = ctx.createRadialGradient(-r * 0.32, -r * 0.4, r * 0.05, 0, 0, r * 1.15);
        g.addColorStop(0, 'rgba(255,255,255,0.75)');
        g.addColorStop(0.25, 'rgba(255,255,255,0.12)');
        g.addColorStop(0.7, 'rgba(0,0,0,0)');
        g.addColorStop(1, 'rgba(0,0,0,0.38)');
        ctx.fillStyle = g;
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.beginPath(); ctx.ellipse(-r * 0.36, -r * 0.46, r * 0.12, r * 0.22, -0.5, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
    }
  };
};

/* 🎊 Confetti — twin cannons, air drag, 3D flutter (scaleY = cos phase) */
FX.make.confetti = function () {
  const W = this.W, H = this.H, u = this.u;
  const parts = [];
  const cannon = (x0, dir, n) => {
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + dir * rand(0.2, 0.75), sp = rand(0.95, 1.7) * H;
      const r = Math.random();
      parts.push({ x: x0, y: H + 5 * u, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, w: rand(9, 17) * u, h: rand(5, 9) * u,
        color: pick(PALETTE), rot: rand(0, 6.28), vr: rand(-9, 9), flip: rand(0, 6.28), vf: rand(6, 15),
        shape: r < 0.18 ? 'circle' : r < 0.32 ? 'ribbon' : 'rect', age: 0, life: rand(3.4, 4.6), sw: rand(0.6, 1.6) });
    }
  };
  cannon(W * 0.04, 1, 120);
  cannon(W * 0.96, -1, 120);
  return {
    update(dt) {
      let alive = false;
      const k = Math.exp(-2.1 * dt);
      for (const p of parts) {
        p.age += dt;
        p.vx = p.vx * k + Math.sin(p.age * 3 * p.sw) * 40 * u * dt;
        p.vy = p.vy * k + 0.5 * H * dt;
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.rot += p.vr * dt; p.flip += p.vf * dt;
        if (p.age < p.life && p.y < H + 40 * u) alive = true;
      }
      return alive;
    },
    draw(ctx) {
      for (const p of parts) {
        if (p.age >= p.life) continue;
        const a = p.age > p.life - 0.6 ? (p.life - p.age) / 0.6 : 1;
        const c = Math.cos(p.rot), s = Math.sin(p.rot), fy = Math.cos(p.flip);
        ctx.globalAlpha = a * (0.75 + 0.25 * Math.abs(fy));
        ctx.setTransform(c, s, -s * fy, c * fy, p.x, p.y);
        ctx.fillStyle = p.color;
        if (p.shape === 'circle') {
          ctx.beginPath(); ctx.arc(0, 0, p.h * 0.7, 0, Math.PI * 2); ctx.fill();
        } else if (p.shape === 'ribbon') {
          ctx.strokeStyle = p.color; ctx.lineWidth = p.h * 0.45;
          ctx.beginPath(); ctx.moveTo(-p.w, 0);
          ctx.bezierCurveTo(-p.w * 0.4, -p.h * 1.4, p.w * 0.4, p.h * 1.4, p.w, 0);
          ctx.stroke();
        } else {
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        }
      }
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }
  };
};

/* 🌧️ Rain cloud — darkened sky, clouds, falling streaks and splashes */
FX.make.rain = function () {
  const W = this.W, H = this.H, u = this.u, F = this;
  let t = 0, acc = 0;
  const dur = 5.5, drops = [], splash = [];
  const clouds = [];
  for (let i = 0; i < 7; i++) clouds.push({ x: (i / 6) * W + rand(-40, 40) * u, y: rand(0.0, 0.1) * H, size: rand(240, 380) * u, vx: rand(-25, 25) * u, ch: i % 3 === 1 ? '🌧️' : '☁️' });
  return {
    update(dt) {
      t += dt;
      const e = smooth01(0, 0.6, t) * (1 - smooth01(dur - 1, dur, t));
      acc += dt * 340 * e;
      while (acc >= 1) {
        acc -= 1;
        drops.push({ x: rand(-0.05, 1.12) * W, y: rand(0.02, 0.15) * H, vy: rand(1.5, 2.1) * H, len: rand(22, 42) * u, ground: H * rand(0.8, 1.0) });
      }
      for (let i = drops.length - 1; i >= 0; i--) {
        const d = drops[i];
        d.y += d.vy * dt; d.x -= d.vy * 0.12 * dt;
        if (d.y > d.ground) {
          for (let j = 0; j < 3; j++) splash.push({ x: d.x, y: d.ground, vx: rand(-90, 90) * u, vy: -rand(110, 260) * u, age: 0 });
          drops.splice(i, 1);
        }
      }
      for (let i = splash.length - 1; i >= 0; i--) {
        const s = splash[i];
        s.age += dt; s.vy += 1400 * u * dt; s.x += s.vx * dt; s.y += s.vy * dt;
        if (s.age > 0.35) splash.splice(i, 1);
      }
      for (const c of clouds) c.x += c.vx * dt;
      this.e = e;
      return t < dur || drops.length > 0;
    },
    draw(ctx) {
      const e = this.e || 0;
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, `rgba(12,18,34,${0.6 * e})`);
      g.addColorStop(0.5, `rgba(12,18,34,${0.32 * e})`);
      g.addColorStop(1, `rgba(12,18,34,${0.2 * e})`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
      for (const c of clouds) F.drawSprite(c.ch, c.x, c.y + (1 - e) * -0.2 * H, c.size, 0, e);
      ctx.strokeStyle = 'rgba(205,222,255,1)';
      ctx.globalAlpha = 0.55 * Math.max(e, 0.3);
      ctx.lineWidth = 1.7 * u;
      ctx.lineCap = 'round';
      ctx.beginPath();
      for (const d of drops) { ctx.moveTo(d.x, d.y); ctx.lineTo(d.x + d.len * 0.12, d.y - d.len); }
      ctx.stroke();
      ctx.fillStyle = 'rgba(215,228,255,1)';
      ctx.beginPath();
      for (const s of splash) { ctx.moveTo(s.x + 2.2 * u, s.y); ctx.arc(s.x, s.y, 2.2 * u, 0, Math.PI * 2); }
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  };
};

/* ⚡ Lasers — concert beams sweeping from the floor and ceiling */
FX.make.lasers = function () {
  const W = this.W, H = this.H, u = this.u;
  let t = 0;
  const dur = 5;
  const hues = [120, 300, 180, 0, 60, 270, 200];
  const beams = [];
  for (let i = 0; i < 7; i++) beams.push({ ox: W * (0.08 + 0.84 * i / 6), oy: H + 8 * u, base: -Math.PI / 2, amp: rand(0.35, 0.85), sp: rand(0.8, 1.9), ph: rand(0, 6.28), hue: pick(hues), w: rand(3, 6) * u });
  beams.push({ ox: 0, oy: -8 * u, base: 0.9, amp: 0.5, sp: 1.3, ph: 0, hue: 300, w: 5 * u });
  beams.push({ ox: W, oy: -8 * u, base: Math.PI - 0.9, amp: 0.5, sp: 1.1, ph: 2, hue: 120, w: 5 * u });
  beams.push({ ox: W / 2, oy: -8 * u, base: Math.PI / 2, amp: 0.9, sp: 1.7, ph: 1, hue: 190, w: 4 * u });
  const len = 2.2 * Math.max(W, H);
  return {
    update(dt) { t += dt; return t < dur; },
    draw(ctx) {
      const e = smooth01(0, 0.35, t) * (1 - smooth01(dur - 0.6, dur, t));
      ctx.fillStyle = `rgba(0,0,12,${0.38 * e})`;
      ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round';
      beams.forEach((b, i) => {
        if (((t * 4 + i * 0.37) % 1) < 0.12) return;           // strobe flicker
        const ang = b.base + Math.sin(t * b.sp + b.ph) * b.amp;
        const ex = b.ox + Math.cos(ang) * len, ey = b.oy + Math.sin(ang) * len;
        const g = ctx.createLinearGradient(b.ox, b.oy, ex, ey);
        g.addColorStop(0, `hsla(${b.hue},100%,65%,${0.95 * e})`);
        g.addColorStop(0.45, `hsla(${b.hue},100%,58%,${0.35 * e})`);
        g.addColorStop(1, `hsla(${b.hue},100%,50%,0)`);
        ctx.strokeStyle = g;
        ctx.globalAlpha = 0.22;
        ctx.lineWidth = b.w * 6;
        ctx.beginPath(); ctx.moveTo(b.ox, b.oy); ctx.lineTo(ex, ey); ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.lineWidth = b.w;
        ctx.stroke();
        ctx.strokeStyle = `rgba(255,255,255,${0.7 * e})`;
        ctx.lineWidth = b.w * 0.35;
        ctx.beginPath(); ctx.moveTo(b.ox, b.oy); ctx.lineTo(b.ox + (ex - b.ox) * 0.25, b.oy + (ey - b.oy) * 0.25); ctx.stroke();
        const fg = ctx.createRadialGradient(b.ox, b.oy, 0, b.ox, b.oy, 60 * u);
        fg.addColorStop(0, `hsla(${b.hue},100%,80%,${0.8 * e})`);
        fg.addColorStop(1, `hsla(${b.hue},100%,60%,0)`);
        ctx.fillStyle = fg;
        ctx.fillRect(b.ox - 60 * u, b.oy - 60 * u, 120 * u, 120 * u);
      });
    }
  };
};

/* =====================================================================
   7b. Face stickers (Photo Booth "Lovestruck" / "Dizzy" style)
       MediaPipe face detector when online, skin-tone tracker otherwise
   ===================================================================== */
const MP_BASE = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21';
const MP_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite';
const FaceAI = {
  state: 'idle',            // idle | loading | ready | failed
  det: null, delegate: 'GPU', last: 0, lastTs: 0, mp: null, files: null,
  async create(delegate) {
    this.delegate = delegate;
    return this.mp.FaceDetector.createFromOptions(this.files, {
      baseOptions: { modelAssetPath: MP_MODEL, delegate },
      runningMode: 'VIDEO',
      minDetectionConfidence: 0.5
    });
  },
  async load() {
    if (this.state !== 'idle') return;
    this.state = 'loading';
    try {
      this.mp = await import(MP_BASE + '/vision_bundle.mjs');
      this.files = await this.mp.FilesetResolver.forVisionTasks(MP_BASE + '/wasm');
      try { this.det = await this.create('GPU'); }
      catch (e) { this.det = await this.create('CPU'); }
      this.state = 'ready';
    } catch (e) {
      console.warn('[face] detector unavailable — using the skin-tone tracker', e);
      this.state = 'failed';
    }
  },
  detect(now) {
    if (this.state !== 'ready' || now - this.last < 66) return;
    const v = E.video;
    if (!(v.readyState >= 2) || !v.videoWidth) return;
    this.last = now;
    this.lastTs = Math.max(Math.round(now), this.lastTs + 1);   // timestamps must increase
    try {
      const res = this.det.detectForVideo(v, this.lastTs);
      Track.applyFace(res && res.detections, v.videoWidth, v.videoHeight, now);
    } catch (e) {
      console.warn('[face] detect failed', e);
      if (this.delegate === 'GPU') {
        this.state = 'loading';
        try { this.det.close(); } catch (err) { /* ignore */ }
        this.create('CPU').then(d => { this.det = d; this.state = 'ready'; }, () => { this.state = 'failed'; });
      } else {
        this.state = 'failed';
      }
    }
  }
};

// round, puffy heart (Photo Booth sticker shape), centred on its visual middle
function heartPath(ctx, s) {
  ctx.beginPath();
  ctx.moveTo(0, s * 0.38);
  ctx.bezierCurveTo(-s * 0.1, s * 0.3, -s * 0.56, s * 0.08, -s * 0.56, -s * 0.15);
  ctx.bezierCurveTo(-s * 0.56, -s * 0.42, -s * 0.2, -s * 0.52, 0, -s * 0.27);
  ctx.bezierCurveTo(s * 0.2, -s * 0.52, s * 0.56, -s * 0.42, s * 0.56, -s * 0.15);
  ctx.bezierCurveTo(s * 0.56, s * 0.08, s * 0.1, s * 0.3, 0, s * 0.38);
  ctx.closePath();
}
const PINKS = [
  ['#ffc4e3', '#ff5cad', '#dd2380'],
  ['#ffd3eb', '#ff7ac0', '#ec3d94'],
  ['#ffb3d9', '#f2469e', '#c8186d'],
  ['#ffe2f1', '#ff9bcf', '#f058a6'],
  ['#ffc0e0', '#ff63b2', '#e22d88']
];
function drawHeart(ctx, s, c) {
  heartPath(ctx, s);
  const g = ctx.createRadialGradient(-s * 0.14, -s * 0.18, s * 0.02, 0, -s * 0.02, s * 0.62);
  g.addColorStop(0, c[0]);
  g.addColorStop(0.42, c[1]);
  g.addColorStop(1, c[2]);
  ctx.fillStyle = g;
  ctx.shadowColor = 'rgba(180,10,90,0.35)';
  ctx.shadowBlur = Math.max(2, s * 0.16);
  ctx.shadowOffsetY = s * 0.04;
  ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath();
  ctx.ellipse(-s * 0.24, -s * 0.2, s * 0.08, s * 0.13, -0.55, 0, Math.PI * 2);
  ctx.fill();
}
// fixed layout for the heart crown: dense arch over the head + a few strays
const HEART_CROWN = (() => {
  let seed = 20261107;
  const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const hearts = [], strays = [];
  const N = 18;
  for (let i = 0; i < N; i++) {
    hearts.push({ u: (i + 0.2 + r() * 0.6) / N, s: 0.15 + r() * 0.17, rot: (r() - 0.5) * 0.8, j: (r() - 0.5) * 0.2,
      ph: r() * 6.28, c: PINKS[(r() * PINKS.length) | 0], a: 0.84 + r() * 0.16 });
  }
  for (let i = 0; i < 7; i++) {
    strays.push({ u: 0.04 + r() * 0.92, s: 0.06 + r() * 0.06, out: 0.12 + r() * 0.16, ph: r(), c: PINKS[(r() * PINKS.length) | 0] });
  }
  return { hearts, strays };
})();
// little blue bird facing +x; flap ∈ [-1, 1]
function drawBird(ctx, s, flap) {
  const g = ctx.createLinearGradient(0, -s * 0.35, 0, s * 0.3);
  g.addColorStop(0, '#7cc4ff'); g.addColorStop(1, '#2a78e0');
  ctx.fillStyle = '#1f5fbf';
  ctx.beginPath(); ctx.moveTo(-s * 0.34, -s * 0.02); ctx.lineTo(-s * 0.64, -s * 0.2); ctx.lineTo(-s * 0.58, s * 0.08); ctx.closePath(); ctx.fill();
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(0, 0, s * 0.42, s * 0.29, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.3, -s * 0.15, s * 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(235,246,255,0.95)';
  ctx.beginPath(); ctx.ellipse(s * 0.06, s * 0.11, s * 0.27, s * 0.14, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffb02e';
  ctx.beginPath(); ctx.moveTo(s * 0.47, -s * 0.19); ctx.lineTo(s * 0.64, -s * 0.12); ctx.lineTo(s * 0.47, -s * 0.07); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(s * 0.35, -s * 0.2, s * 0.065, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(s * 0.37, -s * 0.2, s * 0.035, 0, Math.PI * 2); ctx.fill();
  ctx.save();
  ctx.translate(-s * 0.04, -s * 0.06);
  ctx.rotate(-0.25 - flap * 0.75);
  ctx.fillStyle = '#3b8cf0';
  ctx.beginPath(); ctx.ellipse(-s * 0.12, 0, s * 0.26, s * 0.12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function spriteAt(ctx, ch, size, sx = 1, sy = 1) {
  const b = size <= 72 ? 72 : size <= 144 ? 144 : size <= 288 ? 288 : 512;
  const img = FX.sprite(ch, b), d = size / b * img.width;
  ctx.save();
  ctx.scale(sx, sy);
  ctx.drawImage(img, -d / 2, -d / 2, d, d);
  ctx.restore();
}
function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

const Stickers = {
  hintFilter: -1, hintSince: 0, hinted: false,
  inUse() {
    return isSticker(S.filter) || (S.grid && (S.page === 2 || (Grid.anim && Grid.anim.type === 'page' && Grid.anim.from === 2)));
  },
  active() {
    return Track.face.alpha > 0.02 && Scene.tiles.some(t => isSticker(t.filter));
  },
  // a gentle nudge when a sticker is on but no face has been found yet
  hint(now) {
    if (!isSticker(S.filter) || S.grid) { this.hintFilter = -1; return; }
    if (this.hintFilter !== S.filter) { this.hintFilter = S.filter; this.hintSince = now; this.hinted = false; }
    if (!this.hinted && !Track.found && now - this.hintSince > 2500) {
      this.hinted = true;
      toast('얼굴이 화면에 잘 보이게 맞춰 주세요');
    }
  },
  draw(ctx, t) {
    const F = Track.face, cover = Scene.cover, H = GLR.H;
    const sc = Scene.scissor;
    for (const tile of Scene.tiles) {
      if (!isSticker(tile.filter)) continue;
      const map = (vx, vy) => {
        const b = Track.toBase(vx, vy, cover);
        const tx = (b[0] - 0.5) / tile.crop[0] + 0.5, ty = (b[1] - 0.5) / tile.crop[1] + 0.5;
        return [tile.x + tx * tile.w, H - (tile.y + ty * tile.h)];
      };
      const c = map(F.x, F.y);
      const l = map(F.x - F.w / 2, F.y), r = map(F.x + F.w / 2, F.y), top = map(F.x, F.y - F.h / 2);
      const fw = Math.hypot(r[0] - l[0], r[1] - l[1]);
      const fh = Math.hypot(top[0] - c[0], top[1] - c[1]) * 2;
      if (fw < 4) continue;
      let ang = 0, eyeMid = null, eyeDist = fw * 0.42;
      if (F.eyes) {
        let a = map(F.eyes[0], F.eyes[1]), b = map(F.eyes[2], F.eyes[3]);
        if (a[0] > b[0]) { const tmp = a; a = b; b = tmp; }
        ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
        eyeMid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
        eyeDist = Math.hypot(b[0] - a[0], b[1] - a[1]);
      }
      ctx.save();
      ctx.beginPath();
      ctx.rect(tile.x, H - tile.y - tile.h, tile.w, tile.h);
      if (sc) { ctx.clip(); ctx.beginPath(); ctx.rect(sc[0], H - sc[1] - sc[3], sc[2], sc[3]); }
      ctx.clip();
      ctx.translate(c[0], c[1]);
      ctx.rotate(ang);
      ctx.globalAlpha = F.alpha;
      // eye line in the face's local frame
      let eyeY = -fh * 0.12;
      if (eyeMid) {
        const dx = eyeMid[0] - c[0], dy = eyeMid[1] - c[1];
        eyeY = -dx * Math.sin(ang) + dy * Math.cos(ang);
      }
      this.kind(ctx, tile.filter, fw, fh, eyeY, eyeDist, t, F.alpha);
      ctx.restore();
    }
  },
  orbit(ctx, n, fw, fh, t, speed, alpha, drawItem, size = 0.36) {
    const cy = -fh * 0.98, rx = fw * 0.95, ry = fw * 0.22;
    const items = [];
    for (let i = 0; i < n; i++) {
      const th = t * speed + (i / n) * Math.PI * 2;
      items.push({ i, th, z: Math.sin(th) });
    }
    items.sort((a, b) => a.z - b.z);                    // far side first
    for (const it of items) {
      const x = Math.cos(it.th) * rx;
      const y = cy + Math.sin(it.th) * ry + Math.sin(t * 3 + it.i) * fh * 0.025;
      const k = 0.72 + 0.28 * (it.z + 1) / 2;
      ctx.save();
      ctx.translate(x, y);
      ctx.globalAlpha = alpha * (0.6 + 0.4 * (it.z + 1) / 2);
      drawItem(it, fw * size * k, -Math.sin(it.th) * speed >= 0 ? 1 : -1);
      ctx.restore();
    }
  },
  kind(ctx, f, fw, fh, eyeY, eyeDist, t, alpha) {
    if (f === 17) {                                       // Lovestruck — heart crown
      // an arch from temple to temple over the top of the head; hearts drift slowly along it
      const rx = fw * 0.68, ry = fh * 0.74, cy = -fh * 0.3;
      const at = (u, k) => {
        const phi = Math.PI - 0.14 + u * (Math.PI + 0.28);
        return [Math.cos(phi) * rx * k, cy + Math.sin(phi) * ry * k];
      };
      const drift = t * 0.018;
      const list = HEART_CROWN.hearts.map(h => {
        const u = (h.u + drift) % 1;
        const fade = smooth01(0, 0.07, u) * (1 - smooth01(0.93, 1, u));
        return { h, u, fade };
      }).sort((a, b) => a.h.s - b.h.s);
      for (const { h, u, fade } of list) {
        if (fade <= 0.01) continue;
        const p = at(u, 1 + h.j);
        const bob = Math.sin(t * 2.2 + h.ph) * fh * 0.012;
        const size = fw * h.s * (0.94 + 0.06 * Math.sin(t * 3.1 + h.ph)) * (0.55 + 0.45 * fade);
        ctx.save();
        ctx.translate(p[0], p[1] + bob);
        ctx.rotate(h.rot + Math.sin(t * 1.4 + h.ph) * 0.07);
        ctx.globalAlpha = alpha * h.a * fade;
        drawHeart(ctx, size, h.c);
        ctx.restore();
      }
      for (const st of HEART_CROWN.strays) {
        const life = (t * 0.22 + st.ph) % 1;
        const p = at(st.u, 1 + st.out + life * 0.12);
        ctx.save();
        ctx.translate(p[0], p[1] - life * fh * 0.08);
        ctx.globalAlpha = alpha * Math.sin(life * Math.PI) * 0.95;
        drawHeart(ctx, fw * st.s, st.c);
        ctx.restore();
      }
    } else if (f === 18) {                                // Dizzy birds
      this.orbit(ctx, 5, fw, fh, t, 1.7, alpha, (it, s, dir) => {
        ctx.scale(dir, 1);
        drawBird(ctx, s, Math.sin(t * 16 + it.i * 1.3));
      }, 0.42);
    } else if (f === 19) {                                // Starry
      this.orbit(ctx, 7, fw, fh, t, 1.3, alpha, (it, s) => {
        ctx.rotate(t * 2 + it.i);
        const tw = 0.85 + 0.15 * Math.sin(t * 10 + it.i * 2);
        spriteAt(ctx, it.i % 3 === 1 ? '✨' : it.i % 3 === 2 ? '💫' : '⭐', s * tw);
      });
    } else if (f === 20) {                                // Butterflies
      this.orbit(ctx, 5, fw, fh, t, 0.9, alpha, (it, s, dir) => {
        ctx.rotate(Math.sin(t * 2.5 + it.i) * 0.3);
        spriteAt(ctx, '🦋', s, dir * (0.45 + 0.55 * Math.abs(Math.sin(t * 11 + it.i))), 1);
      }, 0.4);
    } else if (f === 21) {                                // Crown
      ctx.translate(0, -fh * 0.98 + Math.sin(t * 2.2) * fh * 0.015);
      ctx.rotate(Math.sin(t * 1.7) * 0.04);
      spriteAt(ctx, '👑', fw * 0.78);
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 3; i++) {
        const a = (Math.sin(t * 4 + i * 2.1) + 1) / 2;
        ctx.globalAlpha = alpha * a * 0.9;
        ctx.save();
        ctx.translate((i - 1) * fw * 0.28, -fw * 0.2 - i % 2 * fw * 0.06);
        spriteAt(ctx, '✨', fw * 0.16);
        ctx.restore();
      }
    } else if (f === 22) {                                // Bunny ears
      const len = fh * 0.95, wid = fw * 0.2;
      [-1, 1].forEach(side => {
        ctx.save();
        ctx.translate(side * fw * 0.22, -fh * 0.78);
        ctx.rotate(side * (0.2 + Math.sin(t * 3 + side) * 0.06));
        const g = ctx.createLinearGradient(-wid, 0, wid, 0);
        g.addColorStop(0, '#e9e1ea'); g.addColorStop(0.5, '#ffffff'); g.addColorStop(1, '#e2d8e4');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.ellipse(0, -len * 0.5, wid, len * 0.5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffb3cf';
        ctx.beginPath(); ctx.ellipse(0, -len * 0.48, wid * 0.52, len * 0.4, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      });
      ctx.fillStyle = 'rgba(255,120,160,0.28)';
      [-1, 1].forEach(side => { ctx.beginPath(); ctx.ellipse(side * fw * 0.3, fh * 0.12, fw * 0.11, fw * 0.06, 0, 0, Math.PI * 2); ctx.fill(); });
    } else if (f === 23) {                                // Halo
      const y = -fh * 1.05 + Math.sin(t * 2) * fh * 0.02, rx = fw * 0.46, ry = fw * 0.11;
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = `rgba(255,214,110,${0.35 * alpha})`;
      ctx.lineWidth = fw * 0.1;
      ctx.beginPath(); ctx.ellipse(0, y, rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
      const g = ctx.createLinearGradient(-rx, 0, rx, 0);
      g.addColorStop(0, '#ffd56a'); g.addColorStop(0.5, '#fff6cf'); g.addColorStop(1, '#ffc23d');
      ctx.strokeStyle = g;
      ctx.lineWidth = fw * 0.04;
      ctx.beginPath(); ctx.ellipse(0, y, rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
      for (let i = 0; i < 4; i++) {
        const th = t * 1.4 + i * Math.PI / 2;
