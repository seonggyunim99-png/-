<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Photo Booth</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Photo Booth">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" id="touchIcon" href="data:,">
<style>
:root{
  --glass: rgba(30,30,32,.52);
  --glass-strong: rgba(30,30,32,.74);
  --stroke: rgba(255,255,255,.13);
  --stroke-2: rgba(255,255,255,.22);
  --fill: rgba(118,118,128,.24);
  --fill-2: rgba(255,255,255,.08);
  --text: #f5f5f7;
  --muted: rgba(235,235,245,.62);
  --accent: #0a84ff;
  --red: #ff3b30;
  --green: #34c759;
  --spring: cubic-bezier(.34,1.56,.64,1);
  --ease: cubic-bezier(.22,1,.36,1);
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;padding:0;width:100%;height:100%;
  overflow:hidden;overscroll-behavior:none;touch-action:none;
  background:#000;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-text-size-adjust:100%;
}
body{position:fixed;inset:0}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{position:fixed;left:0;top:0;width:100vw;height:100vh;width:100dvw;height:100dvh;overflow:hidden;background:#000}
#video{position:absolute;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none}
#gl,#fx{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#fx{pointer-events:none;z-index:2}
#touch{position:absolute;inset:0;z-index:3}

/* ---------- Glass ---------- */
.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  backdrop-filter:blur(20px) saturate(180%);
  border:.5px solid var(--stroke);
  box-shadow:0 12px 40px rgba(0,0,0,.35),inset 0 .5px 0 rgba(255,255,255,.14);
}

/* ---------- Top control-center bar ---------- */
#topBar{
  position:absolute;z-index:20;top:calc(var(--sat) + 12px);left:50%;
  transform:translateX(-50%);
  display:flex;align-items:center;gap:2px;padding:6px;border-radius:22px;
  transition:opacity .3s var(--ease),transform .5s var(--spring);
}
#topBar.dim{opacity:.0;pointer-events:none;transform:translateX(-50%) translateY(-20px)}
.tb{
  border:0;background:transparent;min-width:60px;padding:0 9px;height:54px;border-radius:16px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:10.5px;font-weight:600;letter-spacing:-.01em;color:var(--text);
  transition:background .25s var(--ease),color .25s,transform .45s var(--spring);
}
.tb span{white-space:nowrap;opacity:.9}
.tb:active{transform:scale(.88)}
.tb.on{background:rgba(255,255,255,.94);color:#111}
.tb.open{background:rgba(255,255,255,.18)}
.tb-sep{width:1px;height:32px;background:var(--stroke-2);margin:0 5px;flex:none}

/* ---------- Control-center panel ---------- */
#ccPanel{
  position:absolute;z-index:30;top:calc(var(--sat) + 84px);left:50%;
  width:min(392px,calc(100vw - 32px));
  max-height:calc(100dvh - var(--sat) - var(--sab) - 210px);
  overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;
  border-radius:26px;padding:14px;background:var(--glass-strong);
  transform-origin:50% 0;transform:translateX(-50%) translateY(-10px) scale(.94);
  opacity:0;pointer-events:none;
  transition:opacity .22s var(--ease),transform .5s var(--spring);
}
#ccPanel.open{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0) scale(1)}
#ccPanel h3{margin:2px 4px 10px;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.cc-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cc-tile{
  border:0;background:var(--fill-2);border-radius:18px;padding:12px;display:flex;align-items:center;gap:10px;
  text-align:left;min-height:62px;transition:transform .4s var(--spring),background .2s;
}
.cc-tile:active{transform:scale(.95)}
.cc-ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);transition:background .25s,color .25s;flex:none}
.cc-tile.on .cc-ic{background:#fff;color:#000}
.cc-tile b{display:block;font-size:14px;font-weight:600}
.cc-tile small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.cc-sec{margin-top:10px;padding:12px 14px;border-radius:18px;background:var(--fill-2);transition:opacity .25s}
.cc-sec.off{opacity:.45}
.cc-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px;font-size:14px}
.cc-row + .cc-row{border-top:.5px solid var(--stroke);margin-top:4px;padding-top:4px}
.cc-row label{flex:1}
.cc-val{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.cc-sec .ttl{font-size:13px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:8px}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;touch-action:none;
}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,#fff var(--p,50%),rgba(255,255,255,.2) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;margin-top:-10px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:rgba(255,255,255,.2)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:#fff}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:#fff}
.switch{position:relative;width:51px;height:31px;border-radius:16px;border:0;background:rgba(120,120,128,.36);flex:none;transition:background .25s}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.25);transition:transform .4s var(--spring)}
.switch.on{background:var(--green)}
.switch.on::after{transform:translateX(20px)}

/* segmented control (shared) */
.seg{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;border-radius:13px;background:var(--fill);height:40px}
.seg button{position:relative;z-index:1;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;transition:color .25s}
.seg button.sel{color:#fff}
.seg .thumb{position:absolute;z-index:0;top:3px;bottom:3px;left:3px;border-radius:10px;background:rgba(255,255,255,.22);box-shadow:0 3px 8px rgba(0,0,0,.25);transition:transform .5s var(--spring),width .3s}
.cc-sec .seg{width:100%}

/* ---------- Reaction bar ---------- */
#reactBar{
  position:absolute;z-index:20;right:calc(var(--sar) + 14px);top:50%;
  transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px;border-radius:30px;
  transition:opacity .3s var(--ease),transform .5s var(--spring);
}
#reactBar.hide{opacity:0;pointer-events:none;transform:translateY(-50%) translateX(40px) scale(.9)}
.rb{width:50px;height:50px;border-radius:50%;border:0;background:transparent;font-size:27px;line-height:1;display:grid;place-items:center;transition:transform .45s var(--spring),background .2s}
.rb:active{transform:scale(.78);background:rgba(255,255,255,.14)}
.rb.pop{animation:rbPop .6s var(--spring)}
@keyframes rbPop{0%{transform:scale(.7)}50%{transform:scale(1.25)}100%{transform:scale(1)}}

/* ---------- Bottom controls ---------- */
#bottom{
  position:absolute;z-index:20;left:0;right:0;bottom:calc(var(--sab) + 12px);
  display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;
}
#bottom > *{pointer-events:auto}
#controls{
  position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  width:min(780px,calc(100vw - 24px));height:78px;padding:0 14px;border-radius:28px;
}
#modeSeg{justify-self:start;grid-template-columns:repeat(3,54px);grid-auto-flow:row;height:46px}
#modeSeg button{padding:0}
#modeSeg .thumb{width:54px}
#shutter{position:relative;width:66px;height:66px;border-radius:50%;border:0;background:transparent;padding:0;justify-self:center}
#shutter::before{content:"";position:absolute;inset:0;border-radius:50%;border:3.5px solid rgba(255,255,255,.95)}
#shutter .core{
  position:absolute;inset:6.5px;border-radius:50%;background:var(--red);display:grid;place-items:center;color:#fff;
  box-shadow:inset 0 -3px 8px rgba(0,0,0,.18);transition:inset .45s var(--spring),border-radius .45s var(--spring),transform .35s var(--spring),background .25s;
}
#shutter .core svg{width:26px;height:26px;transition:opacity .2s,transform .4s var(--spring)}
#shutter:active .core{transform:scale(.86)}
#shutter.recording .core{inset:20px;border-radius:7px}
#shutter.recording .core svg{opacity:0;transform:scale(.4)}
#shutter.busy{pointer-events:none}
#shutter.busy .core{background:#8e8e93}
.ctl-right{justify-self:end;display:flex;align-items:center;gap:8px}
#effectsBtn{
  height:46px;padding:0 16px;border-radius:14px;border:0;background:var(--fill);color:#fff;font-size:15px;font-weight:600;
  display:flex;align-items:center;gap:8px;transition:background .25s,color .25s,transform .4s var(--spring)
}
#effectsBtn:active{transform:scale(.92)}
#effectsBtn.on{background:#fff;color:#000}
#curFilter{font-size:12px;color:var(--muted);font-weight:600;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#pager{
  position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(10px) scale(.9);
  display:flex;align-items:center;gap:6px;padding:5px;border-radius:22px;opacity:0;pointer-events:none;
  transition:opacity .25s var(--ease),transform .5s var(--spring);
}
#pager.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0) scale(1)}
#pager button{width:40px;height:34px;border:0;border-radius:14px;background:transparent;display:grid;place-items:center;transition:transform .4s var(--spring),opacity .2s}
#pager button:active{transform:scale(.85)}
#pager button:disabled{opacity:.25}
#pager .dots{display:flex;gap:7px;padding:0 4px}
#pager .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);transition:background .25s,transform .4s var(--spring)}
#pager .dots i.on{background:#fff;transform:scale(1.2)}
#pager .pname{font-size:12.5px;font-weight:600;color:var(--muted);min-width:86px;text-align:center}

/* ---------- Filmstrip ---------- */
#filmstrip{
  position:relative;width:min(780px,calc(100vw - 24px));height:84px;border-radius:22px;padding:0 10px;
  display:flex;align-items:center;overflow:hidden;transition:height .5s var(--spring),opacity .3s,padding .3s;
}
#filmstrip.collapsed{height:40px}
#strip{display:flex;align-items:center;gap:8px;width:100%;height:100%;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:0 2px}
#strip::-webkit-scrollbar{display:none}
#filmstrip .hint{position:absolute;inset:0;display:none;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--muted);pointer-events:none}
#filmstrip.empty .hint{display:flex}
.thumb-item{
  position:relative;flex:0 0 auto;height:62px;border:0;padding:0;border-radius:10px;overflow:hidden;background:#1c1c1e;
  box-shadow:0 3px 10px rgba(0,0,0,.45);transition:transform .4s var(--spring),opacity .3s;
}
.thumb-item.enter{animation:thumbIn .7s var(--spring) both}
.thumb-item.leave{animation:thumbOut .35s var(--ease) forwards}
.thumb-item:active{transform:scale(.92)}
.thumb-item img{height:100%;width:auto;display:block;pointer-events:none}
.thumb-item .badge{position:absolute;left:5px;bottom:4px;display:flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:2px 5px;border-radius:6px;background:rgba(0,0,0,.55);color:#fff}
.thumb-item .badge svg{width:10px;height:10px;fill:#fff;stroke:none}
@keyframes thumbIn{from{opacity:0;transform:translateX(-46px) scale(.35);max-width:0}to{opacity:1;transform:none;max-width:200px}}
@keyframes thumbOut{to{opacity:0;transform:scale(.3);max-width:0;margin:0 -4px}}

/* ---------- Grid labels ---------- */
#gridLabels{position:absolute;z-index:4;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:3px;pointer-events:none;opacity:0;transition:opacity .25s var(--ease)}
#gridLabels.show{opacity:1}
#gridLabels.swap{opacity:0;transition-duration:.12s}
.gl-tile{position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;border-radius:3px}
.gl-tile span{font-size:13px;font-weight:600;padding:4px 11px;border-radius:999px;background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);white-space:nowrap}
.gl-tile span small{font-weight:500;opacity:.7;margin-left:5px;font-size:11px}
.gl-tile.sel::after{content:"";position:absolute;inset:0;border:3px solid var(--accent);border-radius:3px;box-shadow:0 0 18px rgba(10,132,255,.55)}

/* ---------- Overlays ---------- */
#countdown{position:absolute;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;pointer-events:none}
#countdown span{font-size:min(34vh,260px);font-weight:700;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 10px 50px rgba(0,0,0,.5);opacity:0}
#countdown span.tick{animation:cdTick var(--d,.95s) var(--ease) forwards}
@keyframes cdTick{0%{opacity:0;transform:scale(1.7)}18%{opacity:1;transform:scale(1)}72%{opacity:1;transform:scale(.94)}100%{opacity:0;transform:scale(.72)}}
#flash{position:absolute;inset:0;z-index:55;background:#fff;opacity:0;pointer-events:none}
.pill{position:absolute;z-index:21;left:50%;top:calc(var(--sat) + 84px);transform:translateX(-50%) translateY(-12px) scale(.9);opacity:0;pointer-events:none;border-radius:999px;transition:opacity .25s,transform .5s var(--spring)}
.pill.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
#recPill{display:flex;align-items:center;gap:9px;padding:9px 16px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
#recPill .dot{width:11px;height:11px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);animation:blink 1s steps(1,end) infinite}
@keyframes blink{50%{opacity:.15}}
#quadPill{display:flex;gap:6px;padding:6px}
#quadPill i{width:52px;height:39px;border-radius:7px;background:rgba(255,255,255,.12) center/cover no-repeat;border:1.5px solid rgba(255,255,255,.25);transition:transform .5s var(--spring),border-color .2s}
#quadPill i.cur{border-color:#fff;transform:scale(1.08)}
#quadPill i.done{border-color:transparent;animation:rbPop .5s var(--spring)}
#toast{position:absolute;z-index:70;left:50%;bottom:calc(var(--sab) + 200px);transform:translateX(-50%) translateY(16px);opacity:0;pointer-events:none;padding:11px 18px;border-radius:16px;font-size:14px;font-weight:600;max-width:calc(100vw - 40px);text-align:center;transition:opacity .25s,transform .45s var(--spring)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- Modals ---------- */
.modal{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.modal.open{opacity:1;pointer-events:auto}
.viewer-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;transform:scale(.9) translateY(20px);transition:transform .55s var(--spring)}
.modal.open .viewer-card{transform:none}
.v-media{position:relative;border-radius:18px;overflow:hidden;background:#111;box-shadow:0 24px 70px rgba(0,0,0,.6);display:grid;place-items:center;touch-action:pan-y}
.v-media img,.v-media video{display:block;max-width:min(90vw,1180px);max-height:calc(100dvh - var(--sat) - var(--sab) - 170px);width:auto;height:auto;transition:transform .5s var(--spring)}
.v-media.flipping img{transform:scaleX(-1)}
.v-meta{font-size:13px;color:var(--muted);font-weight:500}
.v-bar{display:flex;align-items:center;gap:4px;padding:6px;border-radius:22px}
.vb{height:48px;min-width:48px;padding:0 16px;border:0;border-radius:15px;background:transparent;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600;transition:background .2s,transform .4s var(--spring),color .2s}
.vb:active{transform:scale(.9);background:rgba(255,255,255,.12)}
.vb:disabled{opacity:.3;pointer-events:none}
.vb.danger{color:#ff453a}
.vb.confirm{background:#ff453a;color:#fff}
.v-sep{width:1px;height:28px;background:var(--stroke-2);margin:0 2px}
.v-nav{position:absolute;top:calc(50% - 40px);width:52px;height:52px;border-radius:50%;border:0;display:grid;place-items:center;z-index:2;transition:transform .4s var(--spring),opacity .2s}
.v-nav:active{transform:scale(.85)}
.v-nav:disabled{opacity:0;pointer-events:none}
.v-nav.prev{left:calc(var(--sal) + 18px)}
.v-nav.next{right:calc(var(--sar) + 18px)}
.v-close{position:absolute;top:calc(var(--sat) + 16px);right:calc(var(--sar) + 18px);width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;z-index:2}

.err-card{width:min(460px,calc(100vw - 40px));padding:28px 26px 24px;border-radius:30px;text-align:center;transform:scale(.92);transition:transform .55s var(--spring);background:var(--glass-strong)}
.modal.open .err-card{transform:none}
.err-icon{width:76px;height:76px;margin:0 auto 14px;border-radius:24px;display:grid;place-items:center;background:rgba(255,69,58,.16);color:#ff6961}
.err-icon svg{width:38px;height:38px}
.err-card h2{margin:0 0 8px;font-size:21px;font-weight:700;letter-spacing:-.01em}
.err-card p{margin:0 0 14px;color:var(--muted);font-size:15px;line-height:1.5}
.err-steps{margin:0;text-align:left;background:rgba(255,255,255,.06);border-radius:16px;padding:12px 16px 12px 34px;font-size:14px;line-height:1.65;color:rgba(235,235,245,.85)}
.err-steps:empty{display:none}
.err-code{margin-top:10px;font-size:11.5px;color:rgba(235,235,245,.38);font-family:ui-monospace,Menlo,monospace;word-break:break-all}
.btn-primary{margin-top:18px;height:52px;padding:0 28px;border:0;border-radius:16px;background:var(--accent);color:#fff;font-size:17px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:transform .4s var(--spring),opacity .2s}
.btn-primary:active{transform:scale(.94)}

#splash{position:absolute;inset:0;z-index:58;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#000;transition:opacity .5s var(--ease)}
#splash.hide{opacity:0;pointer-events:none}
#splash .logo{width:84px;height:84px;border-radius:22px;background:linear-gradient(160deg,#ff5e57,#c81d25);display:grid;place-items:center;box-shadow:0 14px 40px rgba(255,59,48,.35)}
#splash .logo svg{width:44px;height:44px;stroke:#fff}
#splash p{margin:0;color:var(--muted);font-size:15px}
.spinner{width:22px;height:22px;border-radius:50%;border:2.5px solid rgba(255,255,255,.2);border-top-color:#fff;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Responsive ---------- */
@media (max-width:860px){
  .tb{min-width:50px;padding:0 6px}
  .tb span{font-size:9.5px}
  #curFilter{display:none}
}
@media (max-width:700px){
  .tb span{display:none}
  .tb{min-width:44px;padding:0;height:46px}
  #modeSeg{grid-template-columns:repeat(3,46px)}
  #modeSeg .thumb{width:46px}
  #effectsBtn .lbl{display:none}
}
@media (orientation:portrait){
  #reactBar{top:auto;bottom:calc(var(--sab) + 196px);transform:none}
  #reactBar.hide{transform:translateX(40px) scale(.9)}
}
</style>
</head>
<body>

<script>
(() => {
'use strict';

/* =====================================================================
   1. Utilities, state, filter catalogue
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const springEase = t => (t >= 1 ? 1 : 1 - Math.exp(-6.5 * t) * Math.cos(8.6 * t));
const easeOutCubic = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const nextFrame = () => new Promise(r => requestAnimationFrame(() => r()));

const FILTERS = [
  { name: 'Normal',         ko: '일반' },
  { name: 'Sepia',          ko: '세피아' },
  { name: 'Black & White',  ko: '흑백' },
  { name: 'Thermal Camera', ko: '열화상' },
  { name: 'X-Ray',          ko: '엑스레이' },
  { name: 'Comic Book',     ko: '만화책' },
  { name: 'Glow',           ko: '글로우' },
  { name: 'Plastic Camera', ko: '토이 카메라' },
  { name: 'Color Pencil',   ko: '색연필' },
  { name: 'Bulge',          ko: '볼록 거울' },
  { name: 'Dent',           ko: '오목 거울' },
  { name: 'Twirl',          ko: '소용돌이' },
  { name: 'Squeeze',        ko: '압축' },
  { name: 'Mirror',         ko: '데칼코마니' },
  { name: 'Light Tunnel',   ko: '빛 터널' },
  { name: 'Stretch',        ko: '스트레치' },
  { name: 'Fisheye',        ko: '어안 렌즈' },
  { name: 'Lovestruck',     ko: '하트 뿅뿅' },
  { name: 'Dizzy',          ko: '빙글빙글 새' },
  { name: 'Starry',         ko: '반짝 별' },
  { name: 'Butterflies',    ko: '나비' },
  { name: 'Crown',          ko: '왕관' },
  { name: 'Bunny Ears',     ko: '토끼 귀' },
  { name: 'Halo',           ko: '천사 링' },
  { name: 'Sunglasses',     ko: '선글라스' }
];
// 3x3 pages — Normal always sits in the middle tile (index 4)
const PAGES = [
  [1, 2, 3, 4, 0, 5, 6, 7, 8],
  [9, 10, 11, 12, 0, 13, 14, 15, 16],
  [17, 18, 19, 20, 0, 21, 22, 23, 24]
];
const PAGE_NAMES = ['색감 효과', '왜곡 효과', '스티커 효과'];
const isDistortion = f => f >= 9 && f <= 16;
const isSticker = f => f >= 17;
const BLUR_FILTERS = new Set([3, 6]); // filters that read the blurred texture

const PREF_KEY = 'pb-prefs-v1';
const S = {
  filter: 0,
  page: 0,
  grid: false,
  mode: 'single',
  facing: 'user',
  mirror: true,          // mirrored preview
  mirrorOut: true,       // saved result keeps the preview orientation
  flash: true,
  sound: true,
  reactions: true,
  portrait: false, portraitDepth: 0.6,
  studio: false, studioAmt: 0.65,
  center: false, framing: 1, smooth: true,
  distCenter: [0.5, 0.52],
  busy: false,
  recording: false
};
(function loadPrefs() {
  try {
    const p = JSON.parse(localStorage.getItem(PREF_KEY) || '{}');
    ['mirrorOut', 'flash', 'sound', 'reactions', 'portrait', 'portraitDepth', 'studio', 'studioAmt',
     'center', 'framing', 'smooth', 'mode', 'filter'].forEach(k => { if (k in p) S[k] = p[k]; });
    if (!(S.filter >= 0 && S.filter < FILTERS.length)) S.filter = 0;
    if (!['single', 'quad', 'movie'].includes(S.mode)) S.mode = 'single';
  } catch (e) { /* storage unavailable */ }
})();
function savePrefs() {
  try {
    const keep = {};
    ['mirrorOut', 'flash', 'sound', 'reactions', 'portrait', 'portraitDepth', 'studio', 'studioAmt',
     'center', 'framing', 'smooth', 'mode', 'filter'].forEach(k => keep[k] = S[k]);
    localStorage.setItem(PREF_KEY, JSON.stringify(keep));
  } catch (e) { /* ignore */ }
}

const E = {
  app: $('#app'), video: $('#video'), gl: $('#gl'), fx: $('#fx'), touch: $('#touch'),
  gridLabels: $('#gridLabels'), topBar: $('#topBar'), ccPanel: $('#ccPanel'), reactBar: $('#reactBar'),
  countdown: $('#countdown span'), recPill: $('#recPill'), recTime: $('#recTime'), quadPill: $('#quadPill'),
  bottom: $('#bottom'), pager: $('#pager'), pgPrev: $('#pgPrev'), pgNext: $('#pgNext'), pgName: $('#pgName'),
  controls: $('#controls'), modeSeg: $('#modeSeg'), shutter: $('#shutter'), shutterIcon: $('#shutterIcon'),
  effectsBtn: $('#effectsBtn'), curFilter: $('#curFilter'), filmstrip: $('#filmstrip'), strip: $('#strip'),
  flash: $('#flash'), toast: $('#toast'), viewer: $('#viewer'), vMedia: $('#vMedia'), vMeta: $('#vMeta'),
  vShare: $('#vShare'), vFlip: $('#vFlip'), vDelete: $('#vDelete'), vClose: $('#vClose'), vPrev: $('#vPrev'), vNext: $('#vNext'),
  camError: $('#camError'), errTitle: $('#errTitle'), errMsg: $('#errMsg'), errSteps: $('#errSteps'), errCode: $('#errCode'),
  retryCam: $('#retryCam'), splash: $('#splash'), splashMsg: $('#splashMsg')

let toastTimer = 0;
function toast(msg, ms = 2200) {
  E.toast.textContent = msg;
  E.toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => E.toast.classList.remove('show'), ms);
}
function showSplash(on, msg) {
  if (msg) E.splashMsg.textContent = msg;
  E.splash.classList.toggle('hide', !on);
}

/* =====================================================================
   2. Sound — everything synthesised with Web Audio (no audio files)
   ===================================================================== */
const Sound = (() => {
  let ctx = null, master = null, noise = null;
  function get() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); } catch (e) { return null; }
      master = ctx.createGain();
      master.gain.value = 0.9;
      master.connect(ctx.destination);
      const len = ctx.sampleRate;

      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    const c = get(); if (!c) return;
    const t = c.currentTime + 0.004;

    burst(t, 0.07, 0.45, 'bandpass', 950, 1.3);
    tone(190, t, 0.06, 0.28, 'triangle', 90);
    burst(t + 0.082, 0.04, 0.8, 'highpass', 1900, 0.8);
    burst(t + 0.082, 0.10, 0.35, 'bandpass', 620, 1.1);
    tone(150, t + 0.082, 0.07, 0.22, 'triangle', 70);
  }
  function recStart() {
    if (!S.sound) return;
    const c = get(); if (!c) return;
    const t = c.currentTime + 0.004;
    tone(660, t, 0.16, 0.22); tone(990, t + 0.12, 0.22, 0.22);
  }
  function recStop() {
    if (!S.sound) return;
    const c = get(); if (!c) return;
    const t = c.currentTime + 0.004;
    tone(990, t, 0.16, 0.22); tone(660, t + 0.12, 0.24, 0.22);
  }
  function pop(pitch = 1) {
    if (!S.sound) return;
    const c = get(); if (!c) return;
    const t = c.currentTime + 0.004;
    tone(520 * pitch, t, 0.12, 0.16, 'sine', 1200 * pitch);

  return { get, unlock, beep, shutter, recStart, recStop, pop };
})();
