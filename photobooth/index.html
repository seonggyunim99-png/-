      const lw = eyeDist * 0.92, lh = eyeDist * 0.62, gap = eyeDist * 0.1;
      ctx.translate(0, eyeY + Math.sin(t * 2) * fh * 0.004);
      ctx.strokeStyle = '#111';
      ctx.lineWidth = eyeDist * 0.07;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-gap / 2 - lw * 0.05, -lh * 0.28); ctx.quadraticCurveTo(0, -lh * 0.5, gap / 2 + lw * 0.05, -lh * 0.28); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-gap / 2 - lw, -lh * 0.3); ctx.lineTo(-gap / 2 - lw - eyeDist * 0.18, -lh * 0.2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(gap / 2 + lw, -lh * 0.3); ctx.lineTo(gap / 2 + lw + eyeDist * 0.18, -lh * 0.2); ctx.stroke();
      [-1, 1].forEach(side => {
        const x0 = side < 0 ? -gap / 2 - lw : gap / 2;
        roundRectPath(ctx, x0, -lh / 2, lw, lh, lh * 0.38);
        const g = ctx.createLinearGradient(0, -lh / 2, 0, lh / 2);
        g.addColorStop(0, '#3a3a48'); g.addColorStop(1, '#07070b');
        ctx.fillStyle = g;
        ctx.fill();
        ctx.lineWidth = eyeDist * 0.06;
        ctx.stroke();
        ctx.save();
        ctx.clip();
        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.lineWidth = lw * 0.12;
        ctx.beginPath(); ctx.moveTo(x0 + lw * 0.2, lh * 0.5); ctx.lineTo(x0 + lw * 0.65, -lh * 0.5); ctx.stroke();
        ctx.restore();
      });
    }
  }
};

/* =====================================================================
   8. Library (IndexedDB, falls back to memory) + filmstrip + viewer
   ===================================================================== */
const Library = {
  db: null,
  items: [],              // { id, type:'photo'|'quad'|'video', blob, thumb, created, duration, mime, url, thumbUrl }
  async open() {
    if (!('indexedDB' in window)) return;
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('photobooth', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('items', { keyPath: 'id' });
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
        r.onblocked = () => rej(new Error('blocked'));
      });
      const rows = await new Promise((res, rej) => {
        const q = this.db.transaction('items').objectStore('items').getAll();
        q.onsuccess = () => res(q.result || []);
        q.onerror = () => rej(q.error);
      });
      rows.sort((a, b) => a.created - b.created);
      for (const it of rows) {
        if (!(it.blob instanceof Blob)) continue;
        this.items.push(it);
        Filmstrip.add(it, false);
      }
    } catch (e) {
      console.warn('[library] IndexedDB unavailable, keeping items in memory', e);
      this.db = null;
    }
  },
  tx(fn) {
    if (!this.db) return Promise.resolve();
    return new Promise(res => {
      try {
        const t = this.db.transaction('items', 'readwrite');
        fn(t.objectStore('items'));
        t.oncomplete = () => res();
        t.onerror = t.onabort = () => { console.warn('[library] write failed', t.error); res(); };
      } catch (e) { res(); }
    });
  },
  record(it) {
    return { id: it.id, type: it.type, blob: it.blob, thumb: it.thumb, created: it.created, duration: it.duration || 0, mime: it.mime || it.blob.type };
  },
  async add(item) {
    this.items.push(item);
    Filmstrip.add(item, true);
    await this.tx(s => s.put(this.record(item)));
  },
  async update(item) {
    Filmstrip.refresh(item);
    await this.tx(s => s.put(this.record(item)));
  },
  async remove(item) {
    const i = this.items.indexOf(item);
    if (i >= 0) this.items.splice(i, 1);
    Filmstrip.remove(item);
    if (item.url) URL.revokeObjectURL(item.url);
    if (item.thumbUrl) URL.revokeObjectURL(item.thumbUrl);
    item.url = item.thumbUrl = null;
    await this.tx(s => s.delete(item.id));
  }
};
const urlOf = it => it.url || (it.url = URL.createObjectURL(it.blob));
const thumbUrlOf = it => it.thumbUrl || (it.thumbUrl = URL.createObjectURL(it.thumb || it.blob));
const fmtTime = s => { s = Math.max(0, Math.round(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };

const Filmstrip = {
  map: new Map(),
  add(it, animate) {
    const b = document.createElement('button');
    b.className = 'thumb-item' + (animate ? ' enter' : '');
    b.setAttribute('aria-label', it.type === 'video' ? '동영상 보기' : '사진 보기');
    b.innerHTML = '<img alt="">';
    b.firstChild.src = thumbUrlOf(it);
    if (it.type === 'video') {
      b.insertAdjacentHTML('beforeend', `<span class="badge"><svg viewBox="0 0 24 24"><use href="#i-play"/></svg>${fmtTime(it.duration || 0)}</span>`);
    } else if (it.type === 'quad') {
      b.insertAdjacentHTML('beforeend', '<span class="badge">4컷</span>');
    }
    b.addEventListener('click', () => Viewer.open(it));
    b.addEventListener('animationend', () => b.classList.remove('enter'));
    E.strip.appendChild(b);
    this.map.set(it.id, b);
    this.sync();
    if (animate) requestAnimationFrame(() => E.strip.scrollTo({ left: E.strip.scrollWidth, behavior: 'smooth' }));
  },
  refresh(it) {
    const b = this.map.get(it.id);
    if (!b) return;
    if (it.thumbUrl) URL.revokeObjectURL(it.thumbUrl);
    it.thumbUrl = null;
    b.querySelector('img').src = thumbUrlOf(it);
    b.classList.remove('enter'); void b.offsetWidth; b.classList.add('enter');
  },
  remove(it) {
    const b = this.map.get(it.id);
    this.map.delete(it.id);
    if (b) {
      b.classList.add('leave');
      setTimeout(() => { b.remove(); this.sync(); }, 360);
    }
    this.sync();
  },
  sync() {
    const empty = Library.items.length === 0;
    E.filmstrip.classList.toggle('empty', empty);
    E.filmstrip.classList.toggle('collapsed', empty);
  }
};

const Viewer = {
  item: null,
  confirmTimer: 0,
  open(it) {
    if (S.busy || S.recording) return;
    closePanel();
    this.item = it;
    this.render();
    E.viewer.classList.add('open');
    E.viewer.setAttribute('aria-hidden', 'false');
  },
  close() {
    const v = E.vMedia.querySelector('video');
    if (v) { v.pause(); v.removeAttribute('src'); v.load(); }
    E.viewer.classList.remove('open');
    E.viewer.setAttribute('aria-hidden', 'true');
    this.item = null;
    this.resetDelete();
    setTimeout(() => { if (!this.item) E.vMedia.innerHTML = ''; }, 320);
  },
  render() {
    const it = this.item;
    if (!it) return;
    this.resetDelete();
    const old = E.vMedia.querySelector('video');
    if (old) old.pause();
    E.vMedia.innerHTML = '';
    if (it.type === 'video') {
      const v = document.createElement('video');
      v.src = urlOf(it);
      v.controls = true; v.playsInline = true; v.autoplay = true;
      v.setAttribute('playsinline', '');
      E.vMedia.appendChild(v);
    } else {
      const img = document.createElement('img');
      img.src = urlOf(it);
      img.alt = '';
      E.vMedia.appendChild(img);
    }
    const kind = it.type === 'video' ? `동영상 · ${fmtTime(it.duration || 0)}` : it.type === 'quad' ? '4컷 사진' : '사진';
    const d = new Date(it.created);
    E.vMeta.textContent = `${kind} · ${d.toLocaleDateString('ko-KR')} ${d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })}`;
    E.vFlip.disabled = it.type === 'video';
    E.vFlip.title = it.type === 'video' ? '동영상은 반전할 수 없어요' : '';
    const i = Library.items.indexOf(it);
    E.vPrev.disabled = i <= 0;
    E.vNext.disabled = i < 0 || i >= Library.items.length - 1;
  },
  step(d) {
    const i = Library.items.indexOf(this.item) + d;
    if (i < 0 || i >= Library.items.length) return;
    this.item = Library.items[i];
    this.render();
  },
  fileName(it) {
    const d = new Date(it.created), p = n => String(n).padStart(2, '0');
    const stamp = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}-${p(d.getMinutes())}-${p(d.getSeconds())}`;
    const mime = it.mime || it.blob.type || '';
    const ext = it.type === 'video' ? (mime.includes('mp4') ? 'mp4' : mime.includes('quicktime') ? 'mov' : 'webm') : 'jpg';
    return `PhotoBooth_${it.type === 'quad' ? '4cut_' : ''}${stamp}.${ext}`;
  },
  async share() {
    const it = this.item;
    if (!it) return;
    const name = this.fileName(it);
    const type = it.blob.type || (it.type === 'video' ? 'video/mp4' : 'image/jpeg');
    let file = null;
    try { file = new File([it.blob], name, { type }); } catch (e) { file = null; }
    if (file && navigator.canShare && navigator.share) {
      try {
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: 'Photo Booth' });
          return;
        }
      } catch (e) {
        if (e && e.name === 'AbortError') return;
      }
    }
    const a = document.createElement('a');
    a.href = urlOf(it);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast('기기에 저장했어요');
  },
  async flip() {
    const it = this.item;
    if (!it || it.type === 'video') return;
    E.vFlip.disabled = true;
    E.vMedia.classList.add('flipping');
    try {
      const img = await loadImage(urlOf(it));
      const c = document.createElement('canvas');
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      const x = c.getContext('2d');
      x.translate(c.width, 0); x.scale(-1, 1);
      x.drawImage(img, 0, 0);
      const blob = await canvasBlob(c, 'image/jpeg', 0.92);
      it.blob = blob;
      it.thumb = await makeThumb(c);
      if (it.url) URL.revokeObjectURL(it.url);
      it.url = null;
      await sleep(380);
      await Library.update(it);
      if (this.item === it) { this.render(); E.vMedia.classList.remove('flipping'); }
      toast('좌우 반전했어요');
    } catch (e) {
      console.warn(e);
      toast('반전하지 못했어요');
    } finally {
      E.vMedia.classList.remove('flipping');
      E.vFlip.disabled = !this.item || this.item.type === 'video';
    }
  },
  resetDelete() {
    clearTimeout(this.confirmTimer);
    E.vDelete.classList.remove('confirm');
    E.vDelete.querySelector('span').textContent = '삭제';
  },
  async del() {
    const it = this.item;
    if (!it) return;
    if (!E.vDelete.classList.contains('confirm')) {
      E.vDelete.classList.add('confirm');
      E.vDelete.querySelector('span').textContent = '정말 삭제';
      this.confirmTimer = setTimeout(() => this.resetDelete(), 3000);
      return;
    }
    const i = Library.items.indexOf(it);
    await Library.remove(it);
    if (!Library.items.length) { this.close(); toast('삭제했어요'); return; }
    this.item = Library.items[Math.min(i, Library.items.length - 1)];
    this.render();
    toast('삭제했어요');
  }
};

function loadImage(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
}
function canvasBlob(c, type = 'image/jpeg', q = 0.92) {
  return new Promise((res, rej) => {
    if (c.toBlob) c.toBlob(b => (b ? res(b) : rej(new Error('toBlob failed'))), type, q);
    else {
      const bin = atob(c.toDataURL(type, q).split(',')[1]), arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      res(new Blob([arr], { type }));
    }
  });
}
function makeThumb(src, h = 160) {
  const sw = src.width || src.videoWidth, sh = src.height || src.videoHeight;
  const c = document.createElement('canvas');
  c.height = h; c.width = Math.max(1, Math.round(h * sw / sh));
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return canvasBlob(c, 'image/jpeg', 0.8);
}
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* =====================================================================
   9. Capture — countdown, screen flash, single / 4-up / movie
   ===================================================================== */
// Composite the live WebGL frame + reaction layer into a 2D context.
// The preview is mirrored for the front camera; when "결과물 좌우 반전 저장" is off
// the saved file is un-mirrored back to true orientation. Both layers flip together
// so face stickers stay on the face.
function composeTo(ctx, w, h) {
  ctx.save();
  if (S.mirror && !S.mirrorOut) { ctx.translate(w, 0); ctx.scale(-1, 1); }
  ctx.drawImage(E.gl, 0, 0, w, h);
  if (FX.dirty || FX.active()) ctx.drawImage(E.fx, 0, 0, w, h);
  ctx.restore();
}
function captureCanvas() {
  const c = document.createElement('canvas');
  c.width = GLR.W; c.height = GLR.H;
  composeTo(c.getContext('2d'), c.width, c.height);
  return c;
}

function showTick(n, step) {
  const el = E.countdown;
  el.classList.remove('tick');
  el.textContent = n;
  el.style.setProperty('--d', (step / 1000 * 0.96).toFixed(2) + 's');
  void el.offsetWidth;
  el.classList.add('tick');
}
async function countdown(n, step) {
  for (let i = n; i >= 1; i--) {
    showTick(i, step);
    Sound.beep();
    await sleep(step);
  }
}
function screenFlash() {
  if (!S.flash) return;
  if (E.flash.animate) {
    E.flash.animate([{ opacity: 1 }, { opacity: 1, offset: 0.4 }, { opacity: 0 }], { duration: 250, easing: 'ease-out' });
  } else {
    E.flash.style.transition = 'none'; E.flash.style.opacity = '1';
    requestAnimationFrame(() => { E.flash.style.transition = 'opacity .15s ease-out .1s'; E.flash.style.opacity = '0'; });
  }
}
// Flash first so the front camera receives the white "fill light", then grab the frame.
async function snap() {
  if (S.flash) { screenFlash(); await sleep(80); }
  Sound.shutter();
  await nextFrame();
  return captureCanvas();
}

async function takeSingle() {
  await countdown(3, 1000);
  const c = await snap();
  const [blob, thumb] = await Promise.all([canvasBlob(c, 'image/jpeg', 0.92), makeThumb(c)]);
  await Library.add({ id: newId(), type: 'photo', blob, thumb, created: Date.now() });
}

function smallPreview(c) {
  const t = document.createElement('canvas');
  t.height = 90; t.width = Math.round(90 * c.width / c.height);
  t.getContext('2d').drawImage(c, 0, 0, t.width, t.height);
  return t.toDataURL('image/jpeg', 0.7);
}
async function takeQuad() {
  const slots = Array.from(E.quadPill.children);
  slots.forEach(s => { s.className = ''; s.style.backgroundImage = ''; });
  E.quadPill.classList.add('show');
  const shots = [];
  try {
    await countdown(3, 1000);
    for (let i = 0; i < 4; i++) {
      if (i > 0) await countdown(3, 500);        // 1.5 s between frames: quick 3·2·1
      slots[i].className = 'cur';
      const c = await snap();
      shots.push(c);
      slots[i].className = 'done';
      slots[i].style.backgroundImage = `url(${smallPreview(c)})`;
    }
    const out = composeQuad(shots);
    const [blob, thumb] = await Promise.all([canvasBlob(out, 'image/jpeg', 0.92), makeThumb(out)]);
    await Library.add({ id: newId(), type: 'quad', blob, thumb, created: Date.now() });
  } finally {
    setTimeout(() => E.quadPill.classList.remove('show'), 700);
  }
}
// 2×2 Photo Booth sheet with even white borders
function composeQuad(shots) {
  const sw = shots[0].width, sh = shots[0].height;
  const k = Math.min(1, 1200 / sw);
  const cw = Math.round(sw * k), ch = Math.round(sh * k);
  const gap = Math.round(cw * 0.045);
  const out = document.createElement('canvas');
  out.width = cw * 2 + gap * 3;
  out.height = ch * 2 + gap * 3;
  const x = out.getContext('2d');
  x.fillStyle = '#ffffff';
  x.fillRect(0, 0, out.width, out.height);
  x.imageSmoothingQuality = 'high';
  shots.forEach((s, i) => {
    const px = gap + (i % 2) * (cw + gap), py = gap + ((i / 2) | 0) * (ch + gap);
    x.drawImage(s, px, py, cw, ch);
    x.strokeStyle = 'rgba(0,0,0,0.06)';
    x.lineWidth = 1;
    x.strokeRect(px + 0.5, py + 0.5, cw - 1, ch - 1);
  });
  return out;
}

const Recorder = {
  rec: null, chunks: [], stream: null, mime: '', t0: 0, timer: 0, duration: 0, thumbP: null,
  canvas: document.createElement('canvas'), ctx: null,
  supported() { return !!(window.MediaRecorder && this.canvas.captureStream); },
  pickMime() {
    const list = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4;codecs=avc1', 'video/mp4',
      'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
    for (const m of list) { try { if (MediaRecorder.isTypeSupported(m)) return m; } catch (e) { /* next */ } }
    return '';
  },
  async start() {
    if (!this.supported()) { toast('이 브라우저는 동영상 녹화를 지원하지 않아요'); return false; }
    const k = Math.min(1, 1280 / Math.max(GLR.W, GLR.H));
    this.canvas.width = Math.max(2, Math.round(GLR.W * k / 2) * 2);
    this.canvas.height = Math.max(2, Math.round(GLR.H * k / 2) * 2);
    this.ctx = this.canvas.getContext('2d');
    this.draw();
    const vs = this.canvas.captureStream(30);
    const tracks = vs.getVideoTracks().slice();
    const as = await Cam.getAudio();
    if (as) tracks.push(...as.getAudioTracks());
    else toast('마이크 없이 녹화해요');
    this.stream = new MediaStream(tracks);
    this.mime = this.pickMime();
    const opts = { videoBitsPerSecond: 6000000, audioBitsPerSecond: 128000 };
    if (this.mime) opts.mimeType = this.mime;
    try { this.rec = new MediaRecorder(this.stream, opts); }
    catch (e) {
      try { this.rec = new MediaRecorder(this.stream); }
      catch (e2) { toast('녹화를 시작할 수 없어요'); this.release(); return false; }
    }
    this.chunks = [];
    this.rec.ondataavailable = ev => { if (ev.data && ev.data.size) this.chunks.push(ev.data); };
    this.rec.onstop = () => this.finish();
    this.thumbP = makeThumb(this.canvas);
    this.rec.start(1000);
    this.t0 = performance.now();
    S.recording = true;
    E.recTime.textContent = '00:00';
    E.recPill.classList.add('show');
    this.timer = setInterval(() => {
      const s = (performance.now() - this.t0) / 1000;
      E.recTime.textContent = fmtTime(Math.floor(s));
      if (s > 600) this.stop();                     // 10 minute safety limit
    }, 250);
    Sound.recStart();
    syncUI();
    return true;
  },
  draw() { if (this.ctx) composeTo(this.ctx, this.canvas.width, this.canvas.height); },
  stop() {
    if (!this.rec || this.rec.state === 'inactive') return;
    clearInterval(this.timer);
    this.duration = (performance.now() - this.t0) / 1000;
    try { this.rec.stop(); } catch (e) { this.finish(); }
    S.recording = false;
    E.recPill.classList.remove('show');
    Sound.recStop();
    syncUI();
  },
  release() {
    if (this.stream) this.stream.getVideoTracks().forEach(t => t.stop());
    if (Cam.audioStream) { Cam.audioStream.getTracks().forEach(t => t.stop()); Cam.audioStream = null; }
    this.stream = null;
  },
  async finish() {
    const type = ((this.rec && this.rec.mimeType) || this.mime || 'video/mp4').split(';')[0];
    const blob = new Blob(this.chunks, { type });
    this.chunks = [];
    this.rec = null;
    this.release();
    if (!blob.size) { toast('녹화된 내용이 없어요'); return; }
    let thumb = null;
    try { thumb = await this.thumbP; } catch (e) { thumb = null; }
    await Library.add({ id: newId(), type: 'video', blob, thumb, created: Date.now(), duration: this.duration, mime: type });
    toast('동영상을 저장했어요');
  }
};

async function onShutter() {
  Sound.unlock();
  if (S.recording) { Recorder.stop(); return; }
  if (S.busy) return;
  if (!Cam.ready) { if (!Cam.starting) Cam.start(); return; }
  S.busy = true;
  syncUI();
  try {
    closePanel();
    while (S.grid) { if (!Grid.anim) Grid.close(); await Grid.whenIdle(); }
    if (S.mode === 'single') await takeSingle();
    else if (S.mode === 'quad') await takeQuad();
    else { await countdown(3, 1000); await Recorder.start(); }
  } catch (e) {
    console.error(e);
    toast('촬영 중 문제가 생겼어요');
  } finally {
    S.busy = false;
    syncUI();
  }
}

/* =====================================================================
   10. UI wiring
   ===================================================================== */
const FX_LABEL = { portrait: '인물 사진', studio: '스튜디오 조명', center: '센터 스테이지', reactions: '리액션' };
const MODE_ICON = { single: '#i-camera', quad: '#i-quad', movie: '#i-movie' };
const MODE_LABEL = { single: '사진', quad: '4컷 사진', movie: '동영상' };

function placeSegThumb(seg) {
  const btn = seg.querySelector('button.sel');
  const th = seg.querySelector('.thumb');
  if (!btn || !th) return;
  th.style.width = btn.offsetWidth + 'px';
  th.style.transform = `translateX(${btn.offsetLeft - 3}px)`;
}
function setRangeFill(r) { r.style.setProperty('--p', r.value + '%'); }
function fNumber(depth) { return 'ƒ/' + (16 * Math.pow(1.4 / 16, depth)).toFixed(1).replace(/\.0$/, ''); }
function closePanel() { E.ccPanel.classList.remove('open'); $('#tbPanel').classList.remove('open'); }

function syncUI() {
  const on = { portrait: S.portrait, studio: S.studio, center: S.center, reactions: S.reactions };
  $$('.tb[data-fx]').forEach(b => b.classList.toggle('on', !!on[b.dataset.fx]));
  $$('.cc-tile').forEach(t => {
    const v = !!on[t.dataset.fx];
    t.classList.toggle('on', v);
    t.querySelector('[data-state]').textContent = v ? '켬' : '끔';
  });
  $('#tbMirror').classList.toggle('on', S.mirror);
  $('#tbPanel').classList.toggle('open', E.ccPanel.classList.contains('open'));
  $('#secPortrait').classList.toggle('off', !S.portrait);
  $('#secStudio').classList.toggle('off', !S.studio);
  $('#secCenter').classList.toggle('off', !S.center);
  const rp = $('#rgPortrait'), rs = $('#rgStudio');
  rp.value = Math.round(S.portraitDepth * 100); setRangeFill(rp); $('#vPortrait').textContent = fNumber(S.portraitDepth);
  rs.value = Math.round(S.studioAmt * 100); setRangeFill(rs); $('#vStudio').textContent = Math.round(S.studioAmt * 100) + '%';
  $$('#segFraming button').forEach(b => b.classList.toggle('sel', +b.dataset.v === S.framing));
  placeSegThumb($('#segFraming'));
  $('#swSmooth').classList.toggle('on', S.smooth);
  $('#swMirror').classList.toggle('on', S.mirror);
  $('#swMirrorOut').classList.toggle('on', S.mirrorOut);
  $('#swFlash').classList.toggle('on', S.flash);
  $('#swSound').classList.toggle('on', S.sound);

  E.reactBar.classList.toggle('hide', !S.reactions || S.grid);
  $$('#modeSeg button').forEach(b => b.classList.toggle('sel', b.dataset.mode === S.mode));
  placeSegThumb(E.modeSeg);
  E.shutterIcon.firstElementChild.setAttribute('href', MODE_ICON[S.mode]);
  E.shutter.classList.toggle('recording', S.recording);
  E.shutter.classList.toggle('busy', S.busy && !S.recording);
  E.shutter.setAttribute('aria-label', S.recording ? '녹화 중지' : MODE_LABEL[S.mode] + ' 촬영');
  E.modeSeg.style.opacity = (S.busy || S.recording) ? '.45' : '';
  E.modeSeg.style.pointerEvents = (S.busy || S.recording) ? 'none' : '';
  E.effectsBtn.classList.toggle('on', S.grid);
  E.curFilter.textContent = FILTERS[S.filter].ko;
  E.pager.classList.toggle('show', S.grid);
  E.pgPrev.disabled = S.page <= 0;
  E.pgNext.disabled = S.page >= PAGES.length - 1;
  E.pgName.textContent = PAGE_NAMES[S.page];
  $$('#pager .dots i').forEach((d, i) => d.classList.toggle('on', i === S.page));
  $('#tbSwitch').style.opacity = (S.busy || S.recording) ? '.4' : '';
}

function toggleFx(name) {
  if (!(name in FX_LABEL)) return;
  S[name] = !S[name];
  savePrefs();
  syncUI();
  toast(`${FX_LABEL[name]} ${S[name] ? '켬' : '끔'}`, 1200);
}

function bindUI() {
  // Control-center quick toggles and panel
  $$('.tb[data-fx]').forEach(b => b.addEventListener('click', () => toggleFx(b.dataset.fx)));
  $$('.cc-tile').forEach(b => b.addEventListener('click', () => toggleFx(b.dataset.fx)));
  $('#tbPanel').addEventListener('click', () => {
    const open = !E.ccPanel.classList.contains('open');
    E.ccPanel.classList.toggle('open', open);
    syncUI();
  });
  $('#tbMirror').addEventListener('click', () => { S.mirror = !S.mirror; syncUI(); toast(`거울 모드 ${S.mirror ? '켬' : '끔'}`, 1200); });
  $('#tbSwitch').addEventListener('click', () => Cam.switchFacing());

  const rp = $('#rgPortrait'), rs = $('#rgStudio');
  rp.addEventListener('input', () => {
    S.portraitDepth = rp.value / 100;
    if (!S.portrait) S.portrait = true;
    syncUI();
  });
  rs.addEventListener('input', () => {
    S.studioAmt = rs.value / 100;
    if (!S.studio) S.studio = true;
    syncUI();
  });
  rp.addEventListener('change', savePrefs);
  rs.addEventListener('change', savePrefs);
  $$('#segFraming button').forEach(b => b.addEventListener('click', () => {
    S.framing = +b.dataset.v;
    if (!S.center) S.center = true;
    savePrefs(); syncUI();
  }));
  const sw = (id, key, after) => $(id).addEventListener('click', () => { S[key] = !S[key]; savePrefs(); syncUI(); if (after) after(); });
  sw('#swSmooth', 'smooth');
  sw('#swMirror', 'mirror');
  sw('#swMirrorOut', 'mirrorOut');
  sw('#swFlash', 'flash');
  sw('#swSound', 'sound', () => { if (S.sound) Sound.beep(); });

  // Reactions
  $$('.rb').forEach(b => b.addEventListener('click', () => {
    Sound.unlock();
    if (!S.reactions) return;
    FX.spawn(b.dataset.r);
    Sound.pop(1 + Math.random() * 0.3);
    b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
  }));

  // Bottom controls
  $$('#modeSeg button').forEach(b => b.addEventListener('click', () => {
    if (S.busy || S.recording) return;
    S.mode = b.dataset.mode;
    savePrefs(); syncUI();
    toast(MODE_LABEL[S.mode], 1000);
  }));
  E.shutter.addEventListener('click', onShutter);
  E.effectsBtn.addEventListener('click', () => { Sound.unlock(); if (S.grid) Grid.close(); else Grid.open(); });
  E.pgPrev.addEventListener('click', () => Grid.setPage(S.page - 1));
  E.pgNext.addEventListener('click', () => Grid.setPage(S.page + 1));

  // Stage gestures: grid tap/swipe, drag distortion centre, double-tap reset
  let ptr = null, lastTap = 0;
  const setCenter = e => {
    const r = E.app.getBoundingClientRect();
    S.distCenter = [clamp((e.clientX - r.left) / r.width, 0.02, 0.98), clamp(1 - (e.clientY - r.top) / r.height, 0.02, 0.98)];
  };
  E.touch.addEventListener('pointerdown', e => {
    Sound.unlock();
    if (E.ccPanel.classList.contains('open')) { closePanel(); ptr = null; return; }
    ptr = { id: e.pointerId, x: e.clientX, y: e.clientY, moved: false };
    try { E.touch.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    if (!S.grid && isDistortion(S.filter)) setCenter(e);
  });
  E.touch.addEventListener('pointermove', e => {
    if (!ptr || e.pointerId !== ptr.id) return;
    if (Math.hypot(e.clientX - ptr.x, e.clientY - ptr.y) > 10) ptr.moved = true;
    if (!S.grid && isDistortion(S.filter)) setCenter(e);
  });
  const end = e => {
    if (!ptr || e.pointerId !== ptr.id) return;
    const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y, moved = ptr.moved;
    ptr = null;
    if (S.grid) {
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.2) Grid.setPage(S.page + (dx < 0 ? 1 : -1));
      else if (!moved) { const i = Grid.hit(e.clientX, e.clientY); if (i >= 0) Grid.select(i); }
      return;
    }
    if (!moved) {
      const now = performance.now();
      if (now - lastTap < 320 && isDistortion(S.filter)) { S.distCenter = TILE_CENTER.slice(); lastTap = 0; toast('왜곡 중심을 가운데로', 900); }
      else lastTap = now;
    }
  };
  E.touch.addEventListener('pointerup', end);
  E.touch.addEventListener('pointercancel', end);

  // Viewer
  E.vClose.addEventListener('click', () => Viewer.close());
  E.vPrev.addEventListener('click', () => Viewer.step(-1));
  E.vNext.addEventListener('click', () => Viewer.step(1));
  E.vShare.addEventListener('click', () => Viewer.share());
  E.vFlip.addEventListener('click', () => Viewer.flip());
  E.vDelete.addEventListener('click', () => Viewer.del());
  E.viewer.addEventListener('click', e => { if (e.target === E.viewer) Viewer.close(); });
  let vsw = null;
  E.vMedia.addEventListener('pointerdown', e => { vsw = { x: e.clientX, y: e.clientY }; });
  E.vMedia.addEventListener('pointerup', e => {
    if (!vsw || Viewer.item?.type === 'video') { vsw = null; return; }
    const dx = e.clientX - vsw.x, dy = e.clientY - vsw.y;
    vsw = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) Viewer.step(dx < 0 ? 1 : -1);
  });

  // Camera error
  E.retryCam.addEventListener('click', () => {
    Sound.unlock();
    if (E.retryCam.dataset.kind === 'webgl') location.reload();
    else Cam.start();
  });

  // Keyboard (iPad Magic Keyboard)
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName) && e.target.type !== 'range') return;
    if (e.key === 'Escape') {
      if (E.viewer.classList.contains('open')) Viewer.close();
      else if (E.ccPanel.classList.contains('open')) closePanel();
      else if (S.grid) Grid.close();
      syncUI();
    } else if (E.viewer.classList.contains('open')) {
      if (e.key === 'ArrowLeft') Viewer.step(-1);
      if (e.key === 'ArrowRight') Viewer.step(1);
    } else if (e.key === ' ' || e.key === 'Enter') {
      // a focused button already activates itself on Space/Enter — don't double-fire
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      e.preventDefault(); onShutter();
    }
    else if (e.key === 'e' || e.key === 'E') { if (S.grid) Grid.close(); else Grid.open(); }
    else if (S.grid && e.key === 'ArrowLeft') Grid.setPage(S.page - 1);
    else if (S.grid && e.key === 'ArrowRight') Grid.setPage(S.page + 1);
  });

  // Block Safari page zoom / rubber-band, but keep the filmstrip and panel scrollable
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
  document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
  document.addEventListener('touchmove', e => {
    if (e.touches.length > 1 || !e.target.closest('#strip, #ccPanel, input[type=range], video')) e.preventDefault();
  }, { passive: false });
  document.addEventListener('contextmenu', e => { if (!e.target.closest('.v-media')) e.preventDefault(); });

  // Layout
  let rz = 0;
  const onResize = () => {
    cancelAnimationFrame(rz);
    rz = requestAnimationFrame(() => {
      if (GLR.resize()) FX.resize(GLR.W, GLR.H);
      Grid.computeArea();
      placeSegThumb(E.modeSeg);
      placeSegThumb($('#segFraming'));
    });
  };
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', () => setTimeout(onResize, 250));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);

  // Lifecycle: stop recording when hidden, reconnect the camera on return
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (S.recording) Recorder.stop();
      return;
    }
    if (E.video.paused && E.video.srcObject) E.video.play().catch(() => {});
    if (!Cam.alive() && !Cam.starting) Cam.start();
  });
}

/* =====================================================================
   11. Render loop + boot
   ===================================================================== */
let lastT = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = clamp((now - lastT) / 1000, 0, 0.1);
  lastT = now;
  if (GLR.ok && !GLR.lost) {
    if (Cam.ready) {
      GLR.upload(E.video);
      if (Track.needed()) {
        if (FaceAI.state === 'idle') FaceAI.load();
        if (FaceAI.state === 'ready') FaceAI.detect(now);
        else Track.analyze(now);
      }
    }
    if (GLR.hasFrame) drawScene(now, dt);
  }
  FX.frame(dt, now);
  Stickers.hint(now);
  if (S.recording) Recorder.draw();
}

function makeTouchIcon() {
  try {
    const c = document.createElement('canvas');
    c.width = c.height = 180;
    const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 0, 180);
    g.addColorStop(0, '#ff6a5f'); g.addColorStop(1, '#c4161c');
    x.fillStyle = g;
    x.fillRect(0, 0, 180, 180);
    x.strokeStyle = '#fff'; x.lineWidth = 9; x.lineJoin = 'round';
    x.beginPath();
    x.moveTo(36, 66); x.lineTo(62, 66); x.lineTo(74, 48); x.lineTo(106, 48); x.lineTo(118, 66); x.lineTo(144, 66);
    x.lineTo(144, 134); x.lineTo(36, 134); x.closePath(); x.stroke();
    x.beginPath(); x.arc(90, 99, 22, 0, Math.PI * 2); x.stroke();
    $('#touchIcon').href = c.toDataURL('image/png');
  } catch (e) { /* icon is optional */ }
}

async function boot() {
  makeTouchIcon();
  bindUI();
  if (!GLR.init()) {
    if (!E.camError.classList.contains('open')) showError('webgl', 'WebGL context unavailable');
    return;
  }
  GLR.resize();
  FX.resize(GLR.W, GLR.H);
  Grid.computeArea();
  syncUI();
  requestAnimationFrame(loop);
  Library.open();
  await Cam.start();
  syncUI();
}

// test / debugging hook (read-only snapshot + a few actions)
window.PhotoBooth = { S, FILTERS, PAGES, Grid, FX, Library, Recorder, Cam, onShutter, syncUI, GLR, Track, FaceAI };

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();
</script>
</body>
</html>
